**Términos orientales y nombres importantes de personas y de lugares**

**ACHARYA** — Preceptor.

**AKAR** — El Manifestado.

**ALI** — Profeta. Hijo político o yerno del Profeta Mahoma.

**ALLAH** — Dios.

**AMAR DAS, GURU AMAR DAS** — 1479 a 1584. El tercer Guru de los Sikhs.

**ANAMI** — Literalmente: Uno sin nombre. Dios Absoluto. Véase también bajo Maha Dayal... Nirala... y Swami.

**AND y UND** — La región astral entre Pind y Brahmand.

**ANG** — Miembro. Extremidad.

**ANGAD, GURU ANGAD** — 1504 a 1552. Segundo Guru de los Sikhs. Nombre original: Bhai Lehna. Dado el nombre de Angad por Guru Nanak. Literalmente: nacido de Su extremidad.

**ANHAD BANI** — Música no tocada. Shabd. Naam. O Verbo. Palabra.

**ANURAG SAGAR** — Un libro escrito por Sant Kabir.



**BHAI NANDLAL** — Un discípulo y gran devoto del décimo Guru. Quien nombró su libro de versos persas Bandgi Nama... Libro de Oración... como Zindgi Nama... Libro de la Vida. El décimo Guru le tenía mucho aprecio... y le confirió la posición de Maestro. Guru-pad.

**BHANA** — Voluntad del Señor.

**BRAHM** — Regente de las tres regiones inferiores.

**BRAHMA** — El primero de la Trinidad hindú. Consistiendo en: Brahma... el Creador. Vishnu... el Sustentador. Y Shiva... el Destructor.

**BRAHMAN** — La verdadera definición de Brahman es: alguien que conoce a Brahm. Sin embargo... en lenguaje común... denota a la casta más alta de las cuatro castas sacerdotales de los hindúes.

**BRAHMAND** — Literalmente: huevo o envoltura... cascarón... de Brahm. El universo entero... bajo la jurisdicción de Brahm.

**BUDDHA** — Literalmente: El Iluminado. Se refiere al príncipe Sidhartha de Kapil Vastu... India. Quien renunció al mundo para resolver el misterio de la vida. Y obtuvo la posición de Buda... el iluminado. Él es el fundador del budismo.

**BULLAH** — 1760 a 1810. Un poeta santo del Punjab... India. Quien nació en Lahore... distrito de Punjab. Fue discípulo de Shah Inayat.

**CHARAN DASS** — 1760 a 1839. Un santo y poeta místico de Rajasthan... India. Los poemas de su discípula devota... Sehjo Bai... están dedicados en forma de canción... alabando a su Guru. Y se comparan con los poemas de Mira Bhai.

**CHELA** — Un discípulo.

**CHHANDOG UPANISHADA** — Uno de los muchos upanishads. O partes filosóficas y místicas de las escrituras Vedas.

**DADU SAHIB** — Un santo de Rajputana... India. Vivió en el siglo dieciséis.

**DARSHAN** — Visión o mirada. Particularmente la de un santo.

**DARVESH** — Hombre piadoso.

**DARVAN** — Portero.



**DEV** — Deidad.

**DEV DRISHTI** — Visión interna.

**DEVIAN, DEVIAN MARC** — El sendero interno de Luz.

**DHANWANTRI** — Nombre del fundador del sistema medicinal hindú védico.

**DHARAM DAS** — Discípulo principal de Sant Kabir. Quien fue Su sucesor.

**DHUN ATMIC SHABD, DHUN ATMAC SHABD** — Primordial Sonido inexpresable. Referido por Baba Sawan Singh Ji... como la Ley no escrita... y el Lenguaje no hablado.

**DHUNI** — Principio del Sonido. Similar a Dhun Atmac Shabd.

**DIV** — Luz.

**DIVYA DRISHTI** — Véase Dev Drishti.

**EK-ANKAR** — Véase Aunkar.



**FARID** — 1173 a 1266. Santo musulmán nacido en Dipalpur... en el Punjab... India. Sus versos están incluidos en el Guru Granth Sahib. La Biblia de los Sikhs.

**GAGGAN** — Cielo.

**GOVIND** — Dios.

**GORAKHNAT** — Un yogui famoso.

**GOSAIN TULSI DAS** — Un gran santo poeta medioeval. Autor de Ram Charit Manas... el Ramayana hindú. Vivió durante el reinado del emperador Akbar.

**GUNAS** — Atributos o cualidades. La creación del mundo ha sido posible por la interacción de las tres gunas: armonía... actividad... e inercia u oscuridad. Satoguna... Rajoguna... y Tamoguna.

**GURBANI** — Véase Bani.

**GURDWARA** — Un templo Sikh.



**GUR KI BANI** — Véase Bani.

**GUR BHAI** — Hermanos en el Guru. Iniciados del mismo Maestro.

**GURUMUKH** — Portavoz del Guru.

**GUR SIKHI** — Verdadero discipulado.

**GURU** — Literalmente: Preceptor o Guía.

**GURU AMAR DAS** — Véase Amar Das.

**GURU ANGAD** — Véase Angad.

**GURU ARIAN** — 1563 a 1606. Quinto Guru de los sikhs en la línea de Guru Nanak. Arjan recopiló el Granth Sahib. Biblia de los sikhs. Murió como mártir.

**GURU DEV o GURU DEVA** — Forma Radiante del Maestro.

**GURU GOBIND SINGH** — 1666 a 1708. Décimo Guru de los sikhs. Autor de Dasam Granth. Libro del décimo Guru. Fundador de la religión Sikh formal.

**GURU GRANTH SAHIB** — Biblia de los sikhs.

**GURU NANAK** — 1469 a 1539. Primer Guru y fundador de la fe Sikh. La era moderna de oro... del Sendero de los Maestros... Sant Mat. Donde la iniciación a la Ciencia de la Surat Shabd Yoga... está abierta y es libre para todos. Se puede decir que fue acelerada e impuesta por Kabir Sahib... 1440 a 1550. Quien fue contemporáneo de Guru Nanak... por medio siglo.

**HAFIZ SAHIB** — 1320 a 1389. Un gran poeta santo persa. Nació en Shiraz. Hafiz es un nombre que quiere decir: uno que conoce el Corán de corazón. Su verdadero nombre es Shamas-I-Din Mohammed. Lo que quiere decir: Sol de la Religión. Fundada por el Profeta Mahoma. Disfruta de gran popularidad entre los musulmanes... como santo y poeta.

**HARI** — Dios Supremo.

**HARI RAI** — Dios absoluto.



**HAZRAT KHUSRO** — Un discípulo devoto de Khwaja Nizamud-Din Aulia. Khusro está entre los primeros grandes poetas hindúes y urdus. Se dice inventó también el instrumento de cuerdas tan famoso... llamado cítara.

**HAZRAT MOHAMMED** — Profeta mahometano. Fundador de la religión musulmana.

**HAZUR BABA SAWAN SINGH JI MAHARAJ** — 1858 a 1948. Gran santo del Punjab. Maestro de Sant Kirpal Singh Ji Maharaj.

**HOLY GRANTH** — Véase Granth Sahib.

**HU** — La segunda región. Trikuti. Causal. Descrita como Hu y Lahut en términos islámicos y sufíes... respectivamente.

**HUKAM** — Principio controlador en Shabd. O Poder de Dios en acción.



**IBRAHIM** — Profeta Ibrahim.

**INDRA MATI** — Una reina iniciada por el Maestro Kabir.

**INGRIS RISHI** — Un rishi de antaño. Que inició al Señor Krishna en la ciencia de la yoga del Verbo. Shabd.

**ISHT DEV** — El objeto de adoración. Ideal.

**ISWAR** — Lo mismo que Niranjan. Señor de la región Astral.



**JAP JI** — El Adi Granth... libro sagrado de los sikhs... empieza con esta exquisita oración de Guru Nanak. Y juntos integran la filosofía total... de las enseñanzas de los santos.

**JIVA** — Alma en cuerpo físico.



**KAABA** — El mausoleo del Profeta Mahoma en La Meca. Arabia Saudita. Era anteriormente un templo con ídolos. Y ahora es un lugar de peregrinaje... entre el mundo musulmán.

**KABIR** — 1440 a 1518. Un gran nombre en el calendario de los santos. La era moderna de oro del Sendero de los Maestros... Sant Mat. Donde la ciencia del Surat Shabd Yoga es expuesta libremente. Y una experiencia de primera mano... es dada a todos por igual. Y se puede decir que comenzó con Kabir Sahib y Guru Nanak. Quienes fueron contemporáneos... durante medio siglo.



**KRIYAMAN KARMAS** — Las acciones del presente. Que tienen todavía que fructificar.

**LEHNA JI** — Véase Angad.

**LEHAR TALAO** — Lugar de nacimiento de Sant Kabir. En el distrito de Banaras... de U.P. India.

**LAHUT** — Véase Hu.

**LALO** — Un discípulo devoto de Guru Nanak.

**LOGOS** — Lo mismo que Shabd... Naam... o Verbo.

**LORD KRISHNA** — Véase Krishna.

**LORD RAMA** — Rey de Ayudhya. Héroe del Ramayana. Se dice fue la encarnación de Vishnu.



**MACHHINDER NATH** — Un gran yogui de Hatha Yoga. Maestro del famoso Guru Gorakh Nath.

**MAGREBI SAHIB** — Un santo musulmán.

**MAHADAYL** — Literalmente: Misericordia ilimitada. Lo mismo que Anami... El Sin Nombre... Nirala... indescriptiblemente maravilloso... y Swami... El Supremo Señor de todo. Todos estos términos son usados para nombrar al Más Elevado... El Señor Supremo... Dios Absoluto.

**MAHA KAL** — Ciclo de tiempo para la Gran Disolución.

**MAHARISHI ASHTEWAKAR** — Un gran rishi védico. Ashtawakar quiere decir... literalmente: ocho curvaturas. Su cuerpo tenía ocho curvaturas. Este hombre con esa grotesca apariencia en su cuerpo... era sin embargo... un Maestro totalmente competente en la era del Ramayana. Entre los rishis de la India. Que pudo dar una experiencia de espiritualidad de primera mano... al rey Janak. Quien fue el suegro de Rama.

**MAHARISHI VASHISHT** — Un gran rishi de la era del Ramayana. Fue el preceptor del Señor Rama. También fue el autor del libro Yog Vahist... sobre filosofía hindú.

**MAHATMAS** — Grandes almas.



**NABI** — Un profeta.

**NAD** — Principio del Sonido. Igual que Verbo... Palabra... Shabd... Naam... etcétera.

**NAM DEV-A** — Un santo maharishtriano del quinto siglo. Quien más tarde se fue al Punjab. Sus poemas están incluidos en el Granth Sahib.

**NANAK** — Véase Guru Nanak.

**NARAD** — Un sabio de antaño.

**NARAIN** — Dios.

**NIRANJAN** — Señor de la primera región sutil. Sahans-dal-Kan-wal.

**NAREN** — Primer nombre que se dio a Swami Vivekananda.

**NIJ-ANAND** — Bienaventuranza eterna.

**NIRALA** — Indescriptible. Maravilloso. Lo mismo que Maha Dayal... Anami... Swami... etcétera.

**OJAS** — El poder o potencia... que ayuda al espíritu a ascender... de lo finito a lo infinito. Esta potencia es el fruto de la castidad... o Brahmacharya.



**PALTU** — Famoso santo hindú. Del siglo quince. Que murió como mártir. Fue un gran exponente de la Surat Shabd Yoga.

**PANDVAS** — Los cinco Pandavas. Hijos de Pando. Ellos son los héroes del Mahabharata... antiguo clásico hindú.

**PARAM SANT o PARAM SANT SATGURU** — La única diferencia entre Sant-Satguru y Param Sant-Satguru... es que el primero alcanza el estado final en la existencia presente. Mientras que el último... nació ya como Sant-Satguru.

**PARA VIDYA** — Conocimiento del Más Allá. O Ciencia del Alma.

**PAR BRAHMA** — Más Allá de Brahma... o el Creador.

**PARAMESHWAR** — Encarnaciones de Brahma. Señor de la región causal.

**PATAL** — Región inferior.



**PEEPA** — Un santo hindú. Fue un regente cuya búsqueda de la Verdad lo llevó a los pies de Sant Ravidas. Un zapatero de profesión. Quien lo inició en los misterios del más allá.

**PIND** — Región física o material.

**PIR** — Maestro.

**PITRIAN MARC** — El sendero del karma. Que lo mantiene a uno en perpetuo cautiverio. Las acciones buenas dan recompensas. Las acciones malas atraen castigo. Y el ciclo interminable de nacimientos y muertes... sigue su curso. Lo contrario de Devian Marg... el sendero de la Luz que lleva a la Salvación.

**PRALABADH KARMAS** — Los frutos de karmas del pasado. Que son responsables por nuestra existencia del presente.

**PRAKRITIS** — Las formas sutiles de diversos grados... en las cuales se pueden mezclar elementos. Los Prakritis son veinticinco en número. Consistiendo de cinco manifestaciones de los cinco elementos... o Tatwas. Éter. Aire. Fuego. Agua. Y Tierra.

**PRANAS** — Aires vitales.

**PRANVA** — Corriente del Sonido. Shabd. Naam. Etcétera.

**PUL-I-SIRAT** — Se refiere al sendero angosto y estrecho... hacia el Reino Celestial. Del cual Cristo dice: Es más fácil para un camello pasar por el ojo de una aguja... que para una persona rica... entrar al reino del Cielo.

**PANDIT** — Un hombre bien versado.

**QURAN** — La Biblia de los musulmanes.



**RAJAS** — La segunda de las tres gunas o actividades. Satva. Rajas. Tamas. Correspondiendo a las acciones correctas... acciones mundanas... y la inercia... respectivamente.

**RAJ RISHI JANAK** — Gran rey santo de la era del Ramayana. Padre de Sita. Y suegro del Señor Rama... el héroe del Ramayana. Su búsqueda por la Verdad lo llevó a hacer un llamado para una congregación de los rishis. Durante la primera conferencia... Rishi Yagyavalkya le dio solo la teoría de los libros... y recibió su recompensa. Fue en la segunda congregación... que recibió la experiencia de primera mano de espiritualidad... del gran sabio Ashtavakra. Y ganó el título de Raj-Rishi. Y fue ambos: raja... y rishi.

**RAM** — Véase Señor Rama.

**RAM DAS, GURU RAM DAS** — 1534 a 1581. El cuarto Guru de los sikhs en la línea de Guru Nanak.

**RAM RAI** — Sat Purusha. El Señor de la quinta región espiritual.

**RAMA** — Véase Lord Rama.

**RAMA KRISHNA, RAMA KRISHNA PARAMHANS** — Santo de Dakhneshwar... en Bengala. Maestro del célebre Swami Vivekananda.

**RASUL** — Profeta.

**RISHI VED VYAS** — Célebre sabio quien recopiló el gran clásico hindú Mahabharata. Del cual forma parte el Bhagavad Gita.



**SACH KHAND** — La quinta región espiritual. Presidida por Sat Purusha. El reino de la Verdad.

**SACH NAAM** — Verdadero nombre. O sea: Shabd... Naam... o Verbo.

**SADH** — Lo mismo que Santo.

**SADHAK** — Un iniciado... dando el primer paso... hacia el descubrimiento de los misterios del más allá.

**SADHANS** — Discípulos espirituales.

**SAHAJ o SEHAJ** — El Estado de permanencia incambiable. Que está más allá de las tres regiones: física... mental... y causal.

**SANCHI** — Karmas almacenados.

**SANT SATGURU** — Un Maestro competente de espiritualidad. Comisionado en llevar aspirantes de regreso a Dios.

**SAQI** — Literalmente: alguien que sirve vino. El Maestro... quien lo lleva a uno... a la región de Eterna Bienaventuranza.

**SAR BACHAN** — Lo hablado por Swami Shiv Dayal Singh Ji Maharaj. Un Sant Satguru de Agra... India. Escrito en prosa... y en forma de poemas.



**SHEIKH MUIN-UD-DIN CHISTI** — Véase Khwaja Moeen-ud-Din Chisti.

**SHIRAS** — Una famosa ciudad en Irán. Lugar del nacimiento del gran poeta místico Hafiz.

**SHIV NETRA** — Tercer ojo. Ojo interno. Ojo singular.

**SHIV** — Véase Brahman.

**SHUTYA SHAVITER UPANISHAD** — Una de las muchas Upanishadas.

**SHRI RAMA NAND** — Un célebre sabio en la línea de Ramanuj Acharya. El Santo Vaishnav. Él fue hecho famoso por el gran Santo Kabir. Quien lo aclamó como Su Maestro.

**SIDHE** — Yogis que han logrado poderes sobrenaturales... siddhis.

**SIKH** — Un discípulo.

**SIKHISM** — Religión Sikh.

**SIMRITIS** — Escrituras hindúes. Que tratan con el código social.

**SIVA** — Véase Shiva.

**SOHANG** — Cuarta región espiritual. O Señor de la cuarta región sutil.

**SRAOSHA** — Término zoroastriano para Naam... Shabd... Kalma... etcétera.

**SUFI** — Una secta musulmana de místicos.

**SUKH DEV SWAMI** — El hijo del gran sabio Ved Vyas. Autor del Mahabharata... el gran clásico hindú. Se dice que nació con total conocimiento de su existencia previa. Su padre... Ved Vyas... lo mandó hacia el rey Janak. Pero su orgullo en su renunciación y ascetismo... no le permitió ir hacia un rey amoroso. Cuando su padre le amonestó... fue a ver al rey Janak. Pero siempre regresó sin haberlo visto. Desperdiciando así... todos sus poderes ocultos. Fue el sabio Narad... quien finalmente le hizo ver a Janak. Y entonces... Sukh Dev encontró a su real Maestro.

**SUKHMAN** — La arteria entre las dos cejas. El Camino hacia Dios.

**SUNNYA** — La región del Silencio.

**SURAT** — Consciencia individual. Atención.



**SURAT SHABD YOGA** — La Ciencia para entrar en contacto con Surat... consciencia individual o atención... y Shabd... Corriente Primordial.

**SUTE SANT** — Quienes nacen como Santos.

**SWAMI** — El Gran Señor de Todo. Ver Mahadayal... Nirala.

**SWARG LOK** — Paraíso.



**TALWANDI** — Una pequeña aldea en el Punjab... India. El lugar donde nació Guru Nanak... el primer Guru y fundador de la fe Sikh.

**TAMAS** — Una de las tres gunas o atributos. Véase Rajas y Satva.

**TRIGUNATIT** — Más allá de los tres atributos o gunas.

**TRIKUTI** — Plano o región causal. Segunda región espiritual.

**TULSI DAS** — Véase Gosain Tulsi Das.

**TULSI SAHIB** — El gran santo de Hathras... distrito de U.P. India. Fue el príncipe coronado de Gwalior. Cuyo nombre original fue Sham Rao Hulkar. Toda la familia fue de devotos seguidores del Guru Gobind Singh... el décimo Guru de los Sikhs. El príncipe rechazó el trono... y se entregó a las meditaciones. Era contemporáneo de Swami Shiv Dayal Singh Ji Maharaj... de Agra. Fue el autor de Ghat Ramayana. Donde se dan detalladamente... las regiones internas.

**UDGIT** — Literalmente: Música de las esferas. Término upanishad para Naam... Shabd... Verbo... etcétera.

**UNHAD BANI** — Véase Anhad Bani.

**USTAD-I-KAMIL** — Un Santo Maestro.



**VED VYAS** — Véase Rishi Ved Vyas.

**VEDA** — Literalmente: conocimiento realizado. Hay cuatro Vedas: Rig Veda. Sam Veda. Yagur Veda. Y Atharva Veda. Que forman la piedra angular de la religión hindú. Los Vedas son las escrituras sagradas más antiguas. Y han sido pasadas de era en era... por gente que podía recitarlas con el corazón. Después... fueron registradas en hojas de Bhojpatra.

**VEINY NADI** — Las aguas de espiritualidad.

**VISHNU** — Segunda deidad de la Trinidad hindú. El Sustentador. Véase Brahma y Shiva.

**VISHNUPURI** — Región del Señor Vishnu. El Sustentador.

**VIVEKANANDA** — Swami Vivekananda. Fundador de la misión Rama Krishna. Quien llevó el mensaje de vedanta... a América.



**WAH-I-GURU** — Literalmente: Alabanza al Maestro. Usado por Dios.

**WALI** — Hombre-Dios. Maestro Perfecto.



**YUGAS** — Los cuatro ciclos del tiempo. Sat. Dwapar. Treta. Y Kal Yugas. Lo que completa el tiempo para Praley... o disolución. Eras de Oro... Plata... Cobre... y Hierro... respectivamente.

</script><script>(function(){const texto=document.getElementById("content").textContent;function parsear(texto){const lineas = texto.split(/\r?\n/);
            const nodos = [];
            let pila = [];
            let id = 1;
            for (let linea of lineas) {
                linea = linea.trim();
                if (!linea) continue;
                let nivel = -1, etiqueta = linea;
                if (linea.startsWith("# ")) { nivel = 0; etiqueta = linea.slice(2).trim(); }
                else if (linea.startsWith("## ")) { nivel = 1; etiqueta = linea.slice(3).trim(); }
                else if (linea.startsWith("### ")) { nivel = 2; etiqueta = linea.slice(4).trim(); }
                else if (linea.startsWith("#### ")) { nivel = 3; etiqueta = linea.slice(5).trim(); }
                else if (linea.startsWith("- ") || linea.startsWith("* ")) {
                    nivel = pila.length ? pila[pila.length-1].nivel + 1 : 1;
                    etiqueta = linea.slice(2).trim();
                } else {
                    nivel = pila.length ? pila[pila.length-1].nivel + 1 : 1;
                    etiqueta = linea;
                }
                while (pila.length && pila[pila.length-1].nivel >= nivel) pila.pop();
                const padreId = pila.length ? pila[pila.length-1].id : null;
                const nuevoId = id++;
                nodos.push({ id: nuevoId, etiqueta, nivel, padreId });
                pila.push({ id: nuevoId, nivel });
            }
            const hijosMap = new Map();
            nodos.forEach(n => hijosMap.set(n.id, []));
            nodos.forEach(n => { if (n.padreId) hijosMap.get(n.padreId).push(n.id); });
            return { nodos, hijosMap, raices: nodos.filter(n => n.padreId === null) };}const {nodos,hijosMap,raices}=parsear(texto);const nodosMap=new Map(nodos.map(n=>[n.id,n]));let currentReadingList=[],currentReadingIndex=0,currentNodoId=null,synth=window.speechSynthesis,utterance=null,isLooping=false;let exportedDark = false;const btnExp = document.getElementById("btnExpandirAll");const btnCol = document.getElementById("btnColapsarAll");const btnDark = document.getElementById("btnThemeExport");if(btnExp) btnExp.onclick = () => { document.querySelectorAll(".nodo-hijos").forEach(c => c.classList.remove("collapsed")); document.querySelectorAll(".icono-toggle").forEach(i => i.textContent = "▼"); };if(btnCol) btnCol.onclick = () => { document.querySelectorAll(".nodo-hijos").forEach(c => c.classList.add("collapsed")); document.querySelectorAll(".icono-toggle").forEach(i => i.textContent = "▶"); };if(btnDark) btnDark.onclick = () => { exportedDark = !exportedDark; document.body.classList.toggle("dark-theme", exportedDark); btnDark.innerHTML = exportedDark ? "☀️ Modo Claro" : "🌙 Modo Oscuro"; };function construir(id){const n=nodosMap.get(id);if(!n)return null;const hijos=hijosMap.get(id)||[];const d=document.createElement("div");d.className="card-nodo level-"+Math.min(n.nivel,7);d.innerHTML='<div class="nodo-titulo"><span data-id="'+id+'">'+n.etiqueta+'</span></div>';if(hijos.length){const icon=document.createElement("span");icon.className="icono-toggle";icon.textContent="▶";d.querySelector(".nodo-titulo").appendChild(icon);const cont=document.createElement("div");cont.className="nodo-hijos collapsed";hijos.forEach(h=>{const c=construir(h);if(c)cont.appendChild(c);});d.appendChild(cont);d.addEventListener("click",e=>{e.stopPropagation();cont.classList.toggle("collapsed");icon.textContent=cont.classList.contains("collapsed")?"▼":"▶";currentNodoId=id;stopReading();prepararLecturaDesdeNodo(id);document.getElementById("btnPlayPause").textContent="▶";});d.querySelector("span[data-id]").addEventListener("dblclick",e=>{e.stopPropagation();const orig=n.etiqueta;const input=document.createElement("input");input.type="text";input.value=orig;input.style.width="100%";input.className="form-control form-control-sm";const span=e.target;span.replaceWith(input);input.focus();input.addEventListener("blur",()=>{if(input.value.trim()!==orig)span.textContent=input.value.trim();});input.addEventListener("keypress",ev=>{if(ev.key==="Enter")input.blur();});});}return d;}document.getElementById("mapa").append(...raices.map(r=>construir(r.id)).filter(Boolean));document.getElementById("searchInput").addEventListener("input",function(){const term=this.value.toLowerCase().trim();document.querySelectorAll(".card-nodo").forEach(c=>{const ok=!term||c.textContent.toLowerCase().includes(term);c.style.display=ok?"":"none";c.style.boxShadow=(term&&ok)?"0 0 0 2px gold":"";});});document.getElementById("clearSearch").addEventListener("click",()=>{document.getElementById("searchInput").value="";document.querySelectorAll(".card-nodo").forEach(c=>{c.style.display="";c.style.boxShadow="";});});function poblarVoces(){const voces=synth.getVoices().filter(v=>v.lang.startsWith("es"));const sel=document.getElementById("voiceSelect");sel.innerHTML="";voces.forEach((v,i)=>{const o=document.createElement("option");o.value=i;o.textContent=v.name+" ("+v.lang+")";sel.appendChild(o);});const pref=voces.findIndex(v=>v.name.includes("Sabina")||v.name.includes("Diego")||v.name.includes("Google")||v.lang==="es-US");if(pref>=0)sel.selectedIndex=pref;}synth.onvoiceschanged=poblarVoces;poblarVoces();function limpiarTexto(txt){return txt.replace(/^#{1,6}\s*/gm,"").replace(/^[-*]\s*/gm,"").replace(/[*_~`>#\(\)\[\]"";]/g," ").replace(/\n+/g,". ").replace(/\b\d+(\.\d+)*\.?\s*/g," ").replace(/\s{2,}/g," ").trim();}function leerSiguiente(){if(!currentReadingList.length){document.getElementById("currentReading").textContent="Lista vacía.";return;}if(currentReadingIndex>=currentReadingList.length){if(isLooping){currentReadingIndex=0;leerSiguiente();}else{document.getElementById("currentReading").textContent="Finalizada.";document.getElementById("btnPlayPause").textContent="▶";}return;}const txt=currentReadingList[currentReadingIndex],limpio=limpiarTexto(txt);if(!limpio){currentReadingIndex++;leerSiguiente();return;}if(utterance)synth.cancel();utterance=new SpeechSynthesisUtterance(limpio);const voces=synth.getVoices().filter(v=>v.lang.startsWith("es"));if(voces.length)utterance.voice=voces[parseInt(document.getElementById("voiceSelect").value)]||voces[0];utterance.rate=0.9;utterance.pitch=1;utterance.onend=()=>{currentReadingIndex++;leerSiguiente();};synth.speak(utterance);document.getElementById("currentReading").textContent="Leyendo: "+limpio.substring(0,30)+"...";}function prepararLecturaDesdeNodo(id){const lista=[];function recorrer(id){const n=nodosMap.get(id);if(!n)return;lista.push(n.etiqueta);(hijosMap.get(id)||[]).forEach(h=>recorrer(h));}if(nodosMap.has(id))recorrer(id);else raices.forEach(r=>recorrer(r.id));currentReadingList=lista;currentReadingIndex=0;}function togglePlayPause(){if(synth.speaking&&!synth.paused){synth.pause();document.getElementById("btnPlayPause").textContent="▶";}else if(synth.paused){synth.resume();document.getElementById("btnPlayPause").textContent="⏸";}else{if(!currentNodoId)currentNodoId=raices[0].id;prepararLecturaDesdeNodo(currentNodoId);leerSiguiente();document.getElementById("btnPlayPause").textContent="⏸";}}function stopReading(){synth.cancel();utterance=null;isLooping=false;document.getElementById("btnPlayPause").textContent="▶";document.getElementById("btnLoop").textContent="🔁";document.getElementById("currentReading").textContent="Detenido.";}document.getElementById("btnPlayPause").addEventListener("click",togglePlayPause);document.getElementById("btnStop").addEventListener("click",stopReading);document.getElementById("btnLoop").addEventListener("click",()=>{isLooping=!isLooping;document.getElementById("btnLoop").textContent=isLooping?"🔁✅":"🔁";if(isLooping&&!synth.speaking)togglePlayPause();});})();</script></body></html>
