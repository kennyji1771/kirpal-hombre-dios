### Maestro perfecto (Murshid-Kamil)

Un *Sadh*... el que ha trascendido con éxito los planos físico... astral... y causal... y que está por encima de la conciencia del cuerpo y de la mente... puede darnos una guía... y prepararnos para el adiestramiento adicional de un Santo.

Pero el que aún no es un *Sadh*... no puede servirnos de ayuda.

Para una completa liberación del ciclo de nacimientos y muertes... un Santo es necesario.



Un Maestro perfecto... no tiene marca distintiva alguna en Su persona.

Mediante el contacto personal... es como uno gradualmente empieza a conocer algo de Su grandeza. Al igual que un estudiante... que al avanzar en sus estudios... llega poco a poco a conocer algo de la habilidad de su profesor.

Asimismo... el Maestro no puede descubrir toda su Grandeza de una vez. Sino solo en proporción... en que el aspirante vaya mostrando su perspicacia... y haga progresos en el Sendero.



El Maestro empieza exactamente igual que un profesor común. E imparte instrucciones... como lo haría un amigo... o alguien con buenos deseos.

Con el tiempo... demuestra Él la autoridad de un Maestro... o *Murshid*... en el Sendero.

Y finalmente... se le ve encausado en la Verdad... o *Sat*... como un *Satguru*... o el Maestro de la Verdad.

Hasta que llega a la etapa... en que Él y Dios... parecen fusionados el uno en el otro. Sin ninguna línea de demarcación entre ellos.

#### Elementos claves que resalten de cada capitulo para hacer énfasis en el aprendizaje

- El *Murshid-Kamil* es el Maestro completo y perfecto... que ha trascendido los tres planos.
- Un *Sadh* puede guiar inicialmente... pero para la liberación total... se necesita un Santo perfecto.
- El Maestro perfecto no tiene marcas externas. Se le conoce gradualmente... por contacto personal.
- Comienza como amigo. Luego se revela como Maestro. Y finalmente... como *Satguru*... fusionado con Dios.
- Su grandeza... se muestra proporcionalmente al progreso del discípulo.

##### frases memorables del capítulo (crear un máximo de tres frases)

- *El Maestro no puede descubrir toda su Grandeza... de una vez.*
- *Un Maestro perfecto... no tiene marca distintiva alguna en Su persona.*
- *Se le ve encausado en la Verdad... como un Satguru.*



### Cómo encontrar a un Maestro perfecto y reconocerlo

Encontrar un Maestro perfecto... no es tan sencillo como pudiera parecer.

Aunque vivamos en el plano de los sentidos todo el tiempo... no tenemos ojos... para reconocer el polo humano... en donde el poder de Dios trabaja en el mundo.

Empero... donde hay voluntad... existe un camino.



Todo lo que se requiere de un aspirante... es la sinceridad del propósito. Un intenso anhelo. Y una pasión ardiente por el Señor. Por encima de todo lo demás.

Donde hay fuego... el oxígeno por sí mismo... viene en su ayuda.

El principio de la demanda y abastecimiento... trabaja por igual en todas las esferas de la vida. De lo físico... a lo espiritual.

Siempre hay alimento para el hambriento. Y agua... para el sediento.



*Pide... y se te dará.*
*Busca... y encontrarás.*
*Toca... y se te abrirá.*

Mateo, capítulo siete, versículo siete.



*Nadie puede servir a dos Maestros.*
*Pues o bien odiará a uno... y amará al otro.*
*O bien se unirá a uno... y despreciará al otro.*
*No puedes servir a Dios... y a las riquezas.*

Mateo, capítulo seis, versículo veinticuatro.



Pues en la Biblia tenemos:

*Yo el Señor... tu Dios... soy un Dios celoso.*



Y en la misma forma... el Hombre-Dios... como Dios... exige de Sus amantes... un amor exclusivo e ilimitado hacia Sí.

Y a menos que uno esté preparado a sacrificar su todo... cuerpo... mente... y posesiones... el camino hasta Él... no está abierto. Ni tampoco podemos llegar cerca del Hombre-Dios... que pone de manifiesto el camino.



*Cuando el discípulo... chela... está listo... el Guru aparece.*

Es la Ley de Dios.

¿Cómo puede una persona con los ojos vendados... llegar por sí misma... al nicho circundado?



*Ningún hombre viene a Mí... excepto aquel a quien el Padre me mandó acercarlo.*

Juan, capítulo seis, versículo cuarenta y cuatro.



Aquellos a quien Dios desea atraer... son por sí mismos atraídos al Hombre-Dios. O el Hombre-Dios mismo... los encuentra. Sin importar dónde puedan estar.



Similarmente... no le es dado al ser humano... conocer al Hombre-Dios en Su plenitud.

Podemos únicamente obtener... los vislumbres de Su grandeza... que Él tenga a bien conceder.

Solo Él es el juez del tiempo. Y en cada avance... nos va revelando gradualmente... Su riqueza espiritual... en la medida que Él desee.

Y esto lo hace poco a poco. Según lo capacitados que nos haya considerado... para captar... y comprender. Y conservarla a salvo... en custodia.



Al ir uno avanzando en Su compañía... en el sendero interno espiritual... uno llega a conocerlo más y más. Cuando ve Su poder trabajando... en todos los planos internos... de un extremo a otro.

Hasta que en la región puramente espiritual... *Muqam-i-Haq*... o *Sach Khand*... aparece Él... en Su primordial manifestación... *Ek-Ankar*.

#### Elementos claves que resalten de cada capitulo para hacer énfasis en el aprendizaje

- El buscador sincero... es atraído por Dios hacia el Hombre-Dios. Cuando el discípulo está listo... el Maestro aparece.
- Se requiere anhelo ardiente... sinceridad de propósito... y voluntad de sacrificio.
- El Maestro no puede ser conocido plenamente. Solo otorga vislumbres... según la capacidad del devoto.
- A medida que se avanza internamente... se ve Su poder trabajando en todos los planos.
- El reconocimiento del Maestro... no es por marcas externas... sino por gracia... y experiencia interior.

### Su vida y Su conducta

La vida y la conducta de un Maestro perfecto... lo hacen resaltar... como una personalidad única. Separada del resto del género humano.



Primero. Él es siempre el que otorga los dones... y nunca el que los recibe.

Él nunca desea... ni el menor servicio de Sus seguidores.

Gana para Su subsistencia... y nunca es una carga para nadie.

Todos Sus ahorros personales... si los tiene... los usa para el alivio de los necesitados.



*No toques los pies de alguien... que viva de las ofrendas de la gente.*
*¡Oh Nanak! Aquel que gana su propio sustento... y ayuda a los necesitados... conoce el Sendero.*



Segundo. Él no cobra honorarios... por impartir las instrucciones espirituales.

Por el contrario... Él concede la espiritualidad... como un don gratuito. Igual que cualquier otro don de Dios. Como la luz. El aire. El agua.



Tercero. Él es una personificación viviente de humildad.

Con todos Sus poderes y grandeza... en igualdad a Dios... nunca reclama crédito por nada. Sino que todo lo atribuye a Dios... o a Su propio Maestro.

Al igual que una rama de árbol cargada de frutos... Él se inclina ante el más bajo. Y actúa con una sencilla dignidad... que le es muy peculiar.



*Aquel que se considera el más bajo... es realmente el más elevado.*



Cuarto. Él está en paz con todos... y no está enfadado con nadie.

Sonriente... perdona a todos los que hablan mal de Él. Y no busca defectos en otros.

Su amor abarca a toda la humanidad. Al igual que Cristo... proclama y practica la verdad cardinal: Ama a tus enemigos.



Quinto. La pureza... la divinidad... y la espiritualidad... fluyen de Él... como resplandecientes manantiales de agua fresca y refrescante.

Llevando vida a los corazones resecos y ávidos de los aspirantes. Quienes alegremente van avanzando... en el Sendero Espiritual... bajo Su guía capaz.



Sexto. No lleva ninguna ropa llamativa.

Adopta sencillamente... un cómodo sendero intermedio.

Su Gran Carretera Principal... sobrepasa las austeridades por una parte... y las formas y formalidades... por la otra.

Su enseñanza consiste en comunicar verdades naturales... que penetran en el alma. Y todos... independientemente de sexo y edad... pueden practicar la disciplina espiritual... que Él prescribe.



Séptimo. Él nunca cree en los milagros... ni los ejecuta para atraer a la gente... y así ganar credulidad. Como lo haría un prestidigitador.

Mantiene Sus tesoros bien ocultos... en el nicho más profundo... dentro de Sí mismo.

Si la necesidad así lo exige... puede Él hacer uso de Sus poderes... en alguna ocasión especial.

Por supuesto... sienten los discípulos diariamente... la oculta mano del Maestro... que está trabajando para su bienestar... y su progreso.



Después de todo... no tenemos que establecer relación mundana alguna con el Maestro.

Todo lo que necesitamos de Él... es la instrucción espiritual... y la guía. Y si nos puede dar esto... debería considerarse suficiente.



Los Santos Maestros son la manifestación de la Divinidad.

Así como las verdades celestiales alborean en Ellos... silenciosa y sutilmente... también actúan calmadamente Sus instrucciones. Y se hunden hasta lo más profundo de las almas. Sin haberse hablado... palabra alguna.



*Un Sheikh... Maestro... como Dios... está incrustado en el Más Allá sin forma.*
*E imparte Sus enseñanzas... sin emitir una sola sílaba.*
*Las instrucciones del Maestro... están en un lenguaje que no se habla.*
*Y no se puede impartir... ni con palabras habladas... ni con palabras grabadas.*



*¿Por qué no entienden mi lenguaje?*
*Porque no pueden oír... mi Palabra.*

Juan, capítulo ocho, versículo cuarenta y tres.



Su único instrumento... es la lengua del pensamiento.

Para el espíritu... es cuestión de experiencia interna.

Maulana Rumi dice:

*El alma es de la misma esencia que la de Dios.*
*Es Dios en resumen.*
*Y puede expresarse a Sí Mismo... sin ninguna ayuda externa.*
*Como los órganos del habla.*



En las enseñanzas de los Maestros... los sentidos físicos no son de mucha ayuda.

Todo se hace automáticamente... a pesar de los sentidos.

Uno ve sin ojos. Oye sin oídos. Camina sin pies. Actúa sin manos. Y habla sin lengua.

Pues esto... es como la muerte en vida.



*¡Oh Nanak! Solo entonces... es cuando uno conoce la Voluntad Cósmica... y encuentra al Bienamado.*



Maulana Rumi también dice lo mismo:

*Yo vuelo sin alas en aquellas regiones.*
*Viajo ahí sin pies.*
*Disfruto del maná y del elixir... sin labios ni paladar.*
*Y veo las glorias que hay ahí... cerrando mis ojos.*



Octavo. Rara vez tienen los aspirantes... que hacer preguntas al Maestro... para resolver sus dudas. Pues Él espontáneamente explica... las cosas que son predominantes... en las mentes de la audiencia.



Noveno. Repetidas veces se centran en un tema... las enseñanzas del Maestro. El Verbo. *Naam*. O *Surat Shabd Yoga*.

En términos claros nos dicen... que no podemos encontrar a Dios... ni llegar a Él... si nos encauzamos en actividades externas.

Pues Él es el Señor de nuestra mismísima alma. Y por lo tanto... se le tiene que buscar internamente... mediante el proceso de inversión.



San Mateo nos dice en su Evangelio:

*En verdad les digo... que si no vuelven a ser como niños... no entrarán en el Reino de los Cielos.*

Mateo, capítulo dieciocho, versículo tres.



Asimismo... tenemos en el Evangelio de San Lucas:

*En verdad les digo... que cualquiera que no reciba el Reino de Dios... como un niño... no entrará en él.*

Lucas, capítulo dieciocho, versículo diecisiete.



Grande es realmente el ser humano. Pues su cuerpo... es en verdad... el Templo de Dios. Y la joya sublime del conocimiento... brilla internamente.



Una vez más nos dice San Lucas:

*El Reino de Dios no viene por observación.*
*El Reino de Dios... está dentro de ustedes.*

Lucas, capítulo diecisiete, versículos veinte y veintiuno.



Un Santo musulmán habla en términos similares:

*El corazón humano es la mezquita... Masjid.*
*Y el cuerpo... es el lugar de adoración.*
*No es propio de un espíritu... alma... el habitante de la mezquita hecha por Dios... cuerpo humano... andar errante en busca del Bienamado... en los templos hechos por el hombre.*



Tulsi Sahib Magabi Sahib nos dice igualmente:

*Tu Bienamado está dentro de ti... y esto tú lo ignoras.*
*Él es la mismísima alma de tu alma.*
*Y tú estás vagando afuera... en busca de Él.*



Maulana Rumi dice en este contexto:

*Dentro de los pliegues de tu cerebro... hay maravillosos jardines... y bellos lugares.*
*Si deseas disfrutarlos... corre a buscar a un Murshid... Maestro... para que te dé instrucciones.*
*Aquellos que buscan externamente el Tesoro inestimable... están en completa ignorancia.*
*Andan errantes en el confuso espejismo... de las desérticas arenas del mundo.*
*Como un venado que corre de un lado a otro... buscando almizcle en los arbustos.*



Los Santos siempre hablan con convicción y autoridad. Pues lo que expresan... viene de la profundidad de Sus almas.

Su conocimiento... ni se deriva de libros... ni está basado en testimonios escuchados.

Ellos nos dan directamente... una experiencia de primera mano... de Sus propias experiencias. En una forma pura. Sin mezclas... ni adulteraciones.

Asimismo... Ellos nunca piden fe ciega... ni aceptación por imposición.

Por el contrario... a cada aspirante se le pide... que verifique personalmente... el resultado por sí mismo.



La Verdad es aquello... que se debe experimentar de inmediato. Y no después de eras. Por muy débil que pueda ser esa experiencia... en el primer momento.

Los Maestros ven a través de las cosas... hasta sus mismas raíces. Y luego hablan.

Nanak vio a Dios... justo frente a Sí mismo.



Sri Ramakrishna... al hacerle una pregunta Naren... conocido después como Swami Vivekananda... sobre si veía a Dios... contestó:

*Sí, hijo mío. Yo he visto a Dios... como te veo a ti.*



De hecho... todas las Almas Maestras... tienen verdadera experiencia de la Divinidad. Y se deleitan en Su Luz y Vida. Y en cierta forma... se convierten en colaboradores conscientes de Él.

Shamas-i-Tabrez dice:

*Mucho mejor es ver a Dios... con los ojos propios.*
*Y escuchar la Voz de Dios... con los oídos propios.*
*Su gloria está oculta... tras de la oscuridad que hay detrás de los ojos.*
*Y Su grandeza... puede ser percibida internamente.*



En San Juan leemos:

*Cuando los muertos oigan la Voz del Hijo de Dios...*
*Los que oyeren... vivirán.*

Juan, capítulo cinco, versículo veinticinco.



Un derviche... hombre piadoso... no necesita un *darwan*... portero.

Si lo necesita... es para mantener alejados... a los perros del mundo.

Una lengua maligna... o un calumniador... hace el trabajo de un portero... *darwan*... para los derviches. Con el fin de mantener apartados... a los sabios mundanos.



En la biografía de Bhai Bala está registrado... que en una ocasión... Guru Nanak dijo:

*En Kal Yuga... muchos Santos... o manifestaciones de Dios... bajarán para el bien de la sufriente humanidad.*



Bhai Ajita preguntó:

*Maestro... ¿nos dirás cómo reconoceríamos a un Santo perfecto?*
*¿Cuál sería Su expresión... y cómo lo reconoceremos?*



El Maestro contestó:

*Siempre que aparece un Santo... algunos líderes de la sociedad... fanáticos religiosos... e individuos persistentes en castas... hablan mal de Él.*
*Raros son en verdad... los que van a Él.*
*Miembros de diversos rangos... calumnian tanto al Maestro... como a Sus discípulos.*

*La gente en general... se ocupa en actividades externas. Como leer escrituras. Ofrecer oraciones públicas en iglesias... templos... mezquitas. Y recitación de mantras.*

*Esa gente no practicará la Surat Shabd Yoga... sintonizándose con la primordial Corriente del Sonido.*

*Cuando predominan tales condiciones... Yo vendré una y otra vez... a revivir el Sendero de los Maestros. Y enlazaré a la gente... con el Verbo. Anhad Bani.*



Duodécimo. Con el advenimiento de un Santo... las lluvias refrescantes de espiritualidad... inundan los corazones secos y quemados... que están encostrados con el polvo de las eras.

Todo aquel que vaya a Él... ya sea un devoto... o un pecador... obtiene beneficio a su propio modo. Y recibe solaz de Él.

Muchos ladrones... criminales... y bandoleros... han obtenido una completa transformación... en Su compañía.

Al igual que un lavandero... el Maestro limpia nuestras almas... totalmente de todas las impurezas. Corporales... mentales... y causales.

Hasta que brillen en su gloria primordial... y se vuelvan seres realmente luminosos... y vivientes.



Encontramos en un Santo... una incorporación viviente de amor... y sacrificio desinteresado.

Su llamado es universal. Y va dirigido al alma del ser humano.

Miles de aspirantes se congregan alrededor de Él. Y se benefician con Sus enseñanzas.



Decimotercero. Un Santo... es verdaderamente un Hijo de Dios. Y comparte con Él... todos Sus poderes.

Su brazo largo y fuerte... abarca el universo. Y Sus manos se extienden... hacia todas partes del mundo.

La distancia... no tiene limitaciones para Él.

Su gracia salvadora... hace maravillosos milagros... en formas extrañas e impredecibles. Y la gente escapa ilesa... de las muchas situaciones tensas... y sin esperanza. Hasta de las garras de la muerte.



Maestro de la tierra y de los cielos... Él guía a los espíritus... en su jornada de regreso al Hogar. A través de las regiones espirituales.

Y Su forma luminosa... siempre acompaña al alma peregrina... cuando trasciende el cuerpo.



Maulana Rumi dice:

*La mano de un Alma Maestra... no es de ninguna manera más corta... que la de Dios.*
*Es de hecho... la mano de Dios Mismo.*
*Sí... se estira a través de siete cielos.*
*E inspira esperanza y confianza... en los espíritus.*

#### Elementos claves que resalten de cada capitulo para hacer énfasis en el aprendizaje

- El Maestro es un dador... nunca un receptor. Gana su sustento... y no carga a nadie.
- No cobra por la espiritualidad. La otorga gratuitamente... como la luz y el aire.
- Es humilde como rama cargada de frutos. Atribuye todo... a Dios... o a su Maestro.
- Perdona a quienes lo calumnian... y ama a sus enemigos.
- No hace milagros para atraer. Guarda Sus tesoros ocultos... y actúa según la necesidad.

Sus ojos brillan... como los de un león.

### La influencia del Maestro

Él es un Príncipe de la paz. Y está por encima... de los pares de opuestos.

La asociación con Él... hace que se liberen en nosotros... corrientes de bienaventuranza y bendición.

Hace desaparecer todo pensamiento de antagonismo y rivalidad. Y en su lugar... da equilibrio al alma. Llevándola gradualmente... a la Divinidad.



*En cuya compañía se sienta uno bendecido... es el Maestro de la Verdad.*
*Él purifica la mente... y concede salvación al alma.*



Él está totalmente saturado del poder de *ojm*. El fruto de la castidad.

Y Su frente brilla... con Luz divina.

Uno se siente irresistiblemente atraído... por el magnetismo de Sus palabras cargadas.

De Sus ojos brota el brillo de una luz peculiar. Que... como un águila quebrantahuesos... paraliza a la mente.

Él actúa como la levadura. Y activa la vida... en el desierto de la mente.



Con Sus ojos de lince... puede Su mirada penetrar profundamente... en los sentimientos y emociones de una persona. Y Él adapta Sus instrucciones... de acuerdo a los tiempos... y a las necesidades individuales.

La vestimenta física de un alma... o *jiva*... es para Él... igual que un frasco de vidrio transparente.

Aunque puede fácilmente detectar lo que hay adentro... Él nunca lo expone a la vista del público. Y guarda para sí... Su experiencia de cada uno.



Quienquiera que vaya a Él... ya sea un escarabajo o una avispa... recibe dulce fragancia... como de una flor.

En la Casa del Maestro... todo abunda. Y cada cual recibe... lo que desea.



Toda persona que entra en contacto con un Alma Maestra... recibe impresiones espirituales. Las cuales... están con el tiempo... destinadas a fructificar.

Desde el momento en que un individuo encuentra a un Maestro... tiene asegurados... tiempos mejores.



Un *Sant Satguru*... es verdaderamente el Hijo de Dios.

Él tiene amor genuino por igual... para las personas de todas las religiones... nacionalidades... y países.

Él ve la Luz de Dios... en todos.

### Unicidad de Guru, Gurudev, Satguru y Malik

En las escrituras leemos... que Dios es Sin Forma.

Él ve sin ojos. Y hace Su trabajo sin manos. Se mueve sin pies. Y oye sin oídos.

Él lo compenetra todo. Pero no se Le puede ver.

Él está más allá de todo pensamiento. De toda comprensión. Y aprehensión.

El ser humano... con su intelecto limitado... y entendimiento finito... no puede llegar a Él.



¿Cómo entonces... podemos ver a Dios... y amarlo?

El amor y el anhelo... siempre existen entre las criaturas de la misma clase... al mismo nivel.

Las aves del aire... vuelan juntas en bandadas. Y hay amor entre los animales del mismo tipo. Y se desplazan en rebaños.

El hombre... por naturaleza... es social. Y no puede sino vivir en sociedad... con sus semejantes.



Contemplación... significa concentración de las facultades humanas... en un centro o foco.

Pero si el centro y el foco... no son aparentes y visibles... ¿cómo puede haber contemplación alguna?



Para satisfacer esta necesidad fundamental de la humanidad... el Señor Rama... y el Señor Krishna... manifestaciones de *Kal*... o Poder Negativo... tuvieron que venir en la vestimenta de hombre.

Y así lo hicieron los Santos Maestros... que manifestaron a *Sat Purush*... el poder positivo... la Verdad. La base de todo lo que es visible e invisible.

El Universo entero... con sus grandes divisiones y subdivisiones. Desde *Such Khand*... o *Muqam-i-Haq*... hasta *Kal Desh*... el mundo físico que está sujeto a decaer... y a la muerte.



Debemos aclarar... que el mismo Poder se manifiesta en diferentes formas... para mantener la vida a diversos niveles. Igual que la electricidad... que produce fuego por un lugar... y hielo en otro.



Un Santo musulmán ha descrito al Maestro bellamente:

*Si Él es Khuda... Dios que se mueve por Sí mismo... dejen que por Sí mismo venga... a enseñarnos.*



De hecho... Él tiene que descender al nivel del hombre. Pues solo entonces... puede el ser humano conocerlo.

En la vestimenta de un Santo Maestro... Él hace actuar Su voluntad. Dando instrucciones a las almas... que anhelan ir a Él... pero que no pueden alcanzarlo.

Les dice que Él no es un cuerpo físico. E imparte instrucciones a todos los espíritus incorporados... sobre cómo trascender las limitaciones del cuerpo físico.

Y con una transmisión gradual de Su Poder... los saca de la vestimenta física. Y se hace su amigo... y su guía.



Así pues... el Sin Forma... tiene que asumir una forma. Adoptar un polo... para la manifestación de Su Divinidad. En beneficio de la sufriente y desamparada humanidad.

Nos habla de nuestra valía original. Y de cómo podemos recuperar el Reino perdido. El Jardín del Edén. Del cual hemos estado exiliados... desde el principio del tiempo.



El Poder de Dios... trabaja en toda su plenitud... en el polo de un Alma Maestra.

Y por lo tanto... se le puede en verdad describir... como Dios Polarizado. Que viene al mundo... con alegres nuevas... para anunciar a Dios... y al Reino de Dios.

Los cuales... incontables vestiduras o cubiertas... y cercado por incontables limitaciones.

Pero cuando es capaz de trascender los diversos cuerpos... y llega a ser un espíritu libre y sin trabas... puede entonces dar testimonio de la gloria... y de la grandeza del Maestro.

Pues Él es el horizonte... donde la tierra y el cielo se juntan. Y el Sol de la Luz de Dios... surge... e ilumina todo el espacio.



*Un verdadero Sol... está oculto en Él.*



No podemos tener una idea adecuada... sobre la belleza... la grandeza... y la magnificencia de Dios... al mirar la forma física del Maestro.

Para tener una experiencia verdadera de Él... tenemos que elevarnos a Su nivel.

A menos que nos elevemos al nivel de Dios... no podemos conocer a Dios.

Puesto que Dios es espíritu... también nosotros... analizando nuestro ser... debemos ser capaces de separar el espíritu que está en nosotros... de las cubiertas materiales o vestiduras... que lo envuelven.

Pues solo el espíritu... puede ver y experimentar al espíritu. No los sentidos físicos. Ni aun el intelecto... o la mente.



Los ojos de un Maestro... son ventanas encantadas. Que se abren internamente al infinito... y externamente... a lo finito.

En ellos... puede uno recibir vislumbres de Luz divina... sin paralelo en este mundo. Una Luz sin sombras... que nunca se encuentra... en el mar... o en la tierra.



Maulana Rumi nos dice sobre Él:

*Un Hombre-Dios... está siempre en estado de embriaguez... sin una gota de vino.*
*Él siempre está saciado... sin tomar bocado.*
*Sus ojos son los ojos de Dios.*
*Sus manos... son las manos de Dios.*



Aunque vive en el mundo... Él no es del mundo. Ni es un prisionero en la prisión del cuerpo... como lo somos nosotros.

Él es una entidad libre. Y a voluntad... cruza y penetra... en reinos espirituales. Y es competente para conceder este poder... y esta capacidad... a miles de almas... *jivas*... si Él así lo desea.

Un Maestro viviente de la verdad... es uno con la Verdad. Y tiene en Sí... la Verdad... en toda su plenitud. Con lo cual lleva a cabo el trabajo de salvación... que le ha sido confiado.



A pesar de Su forma... Él es Sin Forma.

Él es Verbo personificado. Un gran manantial de amor... bienaventuranza... y paz.

El ser humano... tiene que aprender del hombre. Y de acuerdo con esta ley natural... el Verbo se hace carne... y vive entre nosotros. Para impartir instrucciones espirituales... y dar guía.

Asimismo... al transmitir Su propio impulso de Vida... nos capacita para ir hacia el Hogar.

Mientras hace Su trabajo entre nosotros... todos los días... y a Su dulce voluntad... escapa a Su morada celestial de la Verdad. Para así descansar... en *Nij-anand*... o bienaventuranza imperecedera.



*El Maestro de la Verdad... y la Verdad... son uno.*
*Pues Él es la Verdad polarizada.*
*Él está más allá de todo. Más allá de Brahma... el Principio Primordial.*
*Nanak se ha encontrado con tal Guru.*
*El Maestro de la Verdad... es eternamente el mismo.*
*Ni viene... ni va.*
*Él es el Principio de la Vida imperecedera... que lo compenetra todo.*



Con todos nuestros cánticos... en alabanza del Maestro... nunca podemos hacerle justicia.

Pues Él existió cuando nada era. Y de Él... todo vino a existir... en cada ciclo de la creación.



*¿Quién puede cantar las alabanzas del Maestro?*
*Él es la fuente de la Verdad.*
*Él es eternamente incambiable.*
*La fuente de toda vida... de era en era.*



En el *Gurbani* se menciona... que después de cuidadoso escrutinio interno... uno llega a la conclusión irresistible... de que el Maestro es la Verdad... y la Verdad es el Maestro. Sin distinción alguna entre ambos.



*Al agitar el gran mar interno... una cosa salió a la superficie.*
*El Guru es Gobind... y Gobind es el Guru.*
*¡Oh Nanak! No hay diferencia... entre los dos.*



El Todopoderoso reside en verdad... en la vestimenta de un Santo. Y lleva a cabo Su plan... por medio de Él.



*El Kartar... Principio Primordial... reside en el Maestro.*
*Y Él se convierte... en el medio de la salvación... para muchas almas.*



Uno no conoce nada del amor... sin un Maestro. Pues todos... están exentos de amor.

Hari... Dios... reside en el Maestro. Y el bendito Maestro... se convierte en el eslabón... que conecta a un *jiva*... con Hari.



Kabir Sahib nos dice... que Él es uno con Dios:

*Ahora soy uno contigo... y me siento saciado y bendecido.*
*Habiendo llegado a la morada más elevada... soy uno con Él.*
*De tal manera... que uno no puede distinguir a Kabir... de Ram.*



Similarmente... Shamas-i-Tabrez habla en el mismo tono:

*Hemos llegado a estar tan unidos... como cuerpo y alma.*
*Que de aquí en adelante... nadie puede decir... que soy yo... diferente a Ti.*



Cristo dice también:

*Yo y mi Padre... somos uno.*

Juan, capítulo diez, versículo treinta.

Juan, capítulo catorce, versículo nueve.



Dios y el Hombre-Dios... son en verdad... como el mar y sus mareas.

Momentáneamente... cuando la marea sube y baja... parece que son algo diferentes. Pero son de la misma esencia... del agua del mar padre.

Exactamente lo mismo... es una gota de agua.

Cuando está separada del mar... es una gota. Pero en el momento en que entra en el mar... pierde su aparente individualidad. Y se vuelve parte... y partícula... del mar.

Dios no tiene forma. Mientras está en el Hombre-Dios... asume forma... para instruir y guiar a la gente.



*Nanak... después de cuidadoso estudio de los Vedas... ha llegado a la conclusión... de que no hay diferencia... entre Parbrahm... y el Guru.*
*Dios es el Primordial Principio del Sonido.*
*El cual se otorga a los sedientos... mediante un Hombre-Dios.*
*Dios reside en un Guru... y otorga la Corriente del Sonido... entre los aspirantes.*



Establecido en la Verdad... el Maestro se regocija en la verdad.

Él es al mismo tiempo... el Maestro de la Verdad... y la Verdad misma.

En cada era... Él desciende... para beneficio de los devotos.



En la Biblia tenemos:

*El Verbo se hizo carne... y habitó entre nosotros.*
*Lleno de gracia... y de verdad.*

Juan, capítulo uno, versículo catorce.



En el *Gurbani* leemos:

*No existe ni la más mínima diferencia... entre el Satguru... y Swami. Dios-en-Acción... y Dios.*

*A un hombre de Dios... se le llama Satguru... o Sat Purush.*
*Y Él habla solo de Hari.*
*Cualesquiera que Lo escuche... logra la salvación.*



Al ser el Maestro... Guru... uno con el Todopoderoso... es el hacedor de todo. Y sostiene la creación entera. Incluyendo a las almas en cuerpo... *jivas*.



*El Guru es el Hacedor... y todo lo hace.*
*Él es el verdadero Gurmukh.*
*El Guru es un colaborador consciente de Dios.*
*Y es el sustentador de la creación entera.*
*El Guru es el otorgador de paz y solaz.*
*Y es Kartar... la gran energía motora.*
*¡Oh Nanak! Nosotros vivimos... y tenemos nuestro ser... tan solo en Él.*



Gosain Tulsi Das... el célebre autor del Ramayana hindú... habla así del Maestro:

*Salutación al loto del Guru.*
*Quien es el océano de misericordia... y Dios Mismo... en forma humana.*
*Sus palabras bondadosas... dispersan en nosotros... la oscuridad nacida de ciegos apegos.*



En la Biblia sagrada leemos... que Jesús en una ocasión preguntó a Sus discípulos:

*¿Quién dicen los hombres... que soy yo... el Hijo del hombre?*

Y Simón Pedro contestó y dijo:

*Tú eres el Cristo... el Hijo del Dios viviente.*

Jesús dijo a Pedro:

*Bienaventurado eres... Simón Barjona.*
*Porque la carne y la sangre... no te lo ha revelado.*

*Yo también te digo a ti... que tú eres Pedro.*
*Y sobre esta roca... edificaré mi iglesia.*
*Las puertas del infierno... no prevalecerán contra ella.*

Mateo, capítulo dieciséis, versículos trece... y dieciséis al dieciocho.



En otra ocasión... Él les habló más claramente:

*¿No crees que yo estoy en el Padre... y el Padre en mí?*

Juan, capítulo catorce, versículos ocho al diez.



Guru Arjan nos ha hablado en términos muy explícitos... de su unicidad con Dios:

*Mis templos están en los más altos cielos... y mi Reino es ilimitado.*
*Mi dominio es eterno... e incontable es mi riqueza.*

En las escrituras hindúes tenemos:

En el *Mandukya Upanishad* se encuentra:

*Así como diversas corrientes de las montañas... después de atravesar diferentes llanos... caen en un océano... y pierden sus nombres... y existencia separada...*
*Así los conocedores de Brahma... se fusionan en el ilustre Ser auto-luminoso.*
*Perdiendo sus nombres... y formas.*



Aquí surge la pregunta... de cómo un espíritu que lo penetra todo... puede venir a ocupar un espacio limitado... en un cuerpo humano.

*No conociendo mi carácter trascendente... imperecedero... y supremo... los que no disciernen... piensan de mí... que soy inmanifestado... que me he manifestado.*

Shaloks veinticuatro y veinticinco.



Nuevamente... en el discurso nueve... Shalok once... el bendito Señor dice:

*No conociendo mi naturaleza trascendental... ser el Señor Supremo de todos los seres... me condenan los tontos... ser yo un hombre encarnado.*



Santos musulmanes también parecen corroborar esto... de acuerdo a Maulana Rumi:

Pero por extraño que parezca... Él podía descansar cómodamente... en el corazón de Sus devotos. Y aquel que quisiera encontrarle... lo podía encontrar ahí.



Aunque Él... *Murshid*... vive en la tierra... aun así Su alma se extiende... al ilimitado Más Allá. Lo que todos los razonamientos y filosofías de los religiosos... no pueden alcanzar a comprender.



Shamas-i-Tabrez nos habla de esta manera:

*El Rey de Reyes... está en un trono dentro de nosotros.*
*Tras de una densa cortina.*
*En la vil vestimenta de carne... Él viene a otorgarnos acceso... a Sí Mismo.*



Bulleh Shah dice:

*Maula... Dios... se vuelve hombre... para sacar a los hombres... de su profundo sueño.*



Tenemos en el *Gurbani* muchas referencias sobre esto:

*Hombre-Dios. Él trabaja como un medio para un fin. Como un vínculo entre el hombre y Dios.*

Pedro el Grande... Zar de Rusia... estaba ansioso de aprender todo sobre la construcción de barcos... y el arte de la navegación. Así que se fue a Holanda... disfrazado como un obrero común.

En los astilleros holandeses... había otros muchos obreros rusos... que trabajaban para ganarse la vida. Y Pedro trabajó con ellos.

Les hablaba de Rusia... su país nativo. Y a menudo... les pedía que regresasen con él.

Estas pobres gentes... eran exiliados de su país. Y suspiraban... porque no podían volver... por mucho que lo desearan.

Pedro les dijo... que el poderoso Zar... era conocido suyo. Y que él podría lograr... que se les concediera el perdón.

Pero muy pocos podían imaginar... que una persona con ropa tan andrajosa como la de ellos... tendría algo que ver con el Zar.



Cuando Pedro emprendió el viaje de regreso a su hogar... después de haber terminado su aprendizaje... solamente unos cuantos... que creyeron sus palabras... lo acompañaron.

Cuando entró a Rusia... fue recibido de lugar en lugar... en forma regia.

Y al ver los trabajadores proscritos... el honor que se le rendía a Pedro... se sintieron animados y confiados... en que podría hacer que el Zar... anulara el decreto de exilio... que había en su contra.

Finalmente... cuando vieron a Pedro entrar en su capital... y ascender al trono... se quedaron asombrados... por el cambio de su compañero.



El Maestro... al igual que Pedro el Zar... es el Rey de Reyes.

Viene al muelle... o a la prisión de este mundo... igual que un trabajador común... o prisionero... como nosotros.

Él también se gana Su sustento... como nosotros. Nos habla de nuestra tierra natal. Nos infunde un anhelo... y un deseo de volver al hogar. Y ofrece ser nuestro compañero... y guía... en el camino.

Unos cuantos empiezan a actuar conforme a Sus consejos. Y se les saca de esta inmensa prisión... para ir de regreso... al trono de Dios.

Donde ellos encuentran al Maestro... en Su forma radiante. Más brillante... que miles de soles... y lunas juntas.



Guru Arjan nos dice... que Aquel que nos mandó al exilio... nos está ahora llamando... para que regresemos a Su Reino... como Sus verdaderos herederos... y legatarios.



Asimismo... cuando la reina Indra Mati... terminó su curso de disciplina espiritual... y llegó a *Sach Khand*... encontró a su Maestro Kabir... en el asiento de *Sat Purush*. El verdadero Dios.

Al ver esto... ella dijo:

*Maestro... ¿por qué no me dijiste... que Tú mismo eras Sat Purush?*
*Yo te hubiera creído.*

Kabir sonriente contestó:

*Yo no te hubiese podido convencer... entonces.*



Todos los Santos que llegan a *Sak Lok*... o *Anami Desh*... se vuelven uno con Dios. Y por tanto... están todos clasificados igual. Y no se puede decir... que uno sea más grandioso... que el otro.

Quien trate de distinguir a un Santo de otro... va de cabeza... al infierno.



Generalmente se congregan miles de personas... alrededor de un Maestro... *Satguru*... y escuchan Sus charlas.

Pero cada uno lo ve... de acuerdo a su propia formación mental y espiritual.

Algunos lo consideran como una persona piadosa. Otros lo toman por un filósofo. Y algunos... sencillamente como un hombre erudito.

Otros lo ven como un hombre idealmente moral. Y aun otros... como un trabajador desinteresado.

Raras son en verdad... las almas que encuentran en Él... a Dios.



Por lo tanto... cada uno encuentra en Él... un reflejo de lo que él mismo... en realidad es... o desea ser.

Y así recibe del Maestro... esa cualidad. Pues Él distribuye a cada uno... lo que merece.

Como hombre en vestimenta física... Su principal deber es... por supuesto... el formar al ser humano. Y como Dios personificado... es el revelar... o manifestar a Dios.

Así que todo depende.

### La naturaleza de la Unicidad

La unidad entre Dios y el Hombre-Dios... es como el mar y sus mareas. Aparente dualidad... misma esencia.

### Las bendiciones de Dios y del Maestro

*Estrecha es la puerta... y angosto el camino... que conduce a la vida.*
*Y pocos son... los que la encuentran.*

Mateo, capítulo siete, versículo catorce.



También en los Vedas... hay textos que prescriben incontables reglas y reglamentos... para la ejecución de ejercicios yóguicos... *asanas*... y *sadhans*. Tan difíciles... que el pensar en ellos... hace erizar los cabellos.

Con tantas penalidades por delante... ¿cómo puede un débil niño de barro... impotente como es... manejado constantemente por la mente y la materia... enredado en las redes de ciego apasionamiento... y acosado por deseos... ira... codicia... apego... y egoísmo... escapar por sí mismo ileso... y llegar a ser un afortunado peregrino... que camina con éxito sobre el Sendero?



En este extraño estado de cosas... todas ellas desconcertantes... y que engañan... sin salida alguna... Dios tiene misericordia de Sus criaturas.

Él Mismo baja en atavío vil de hombre... a sufrir infortunios... para que Sus hijos... puedan ser bendecidos.



Pero nuevamente... nos enfrentamos a la misma dificultad.

No es fácil comprender las enseñanzas del Maestro... y seguirlas estrictamente... día tras día. Confiar en Él. Y entregar completamente nuestro ser... cuerpo y alma... a Su voluntad.

A menos que Dios y el Satguru... tengan piedad con el alma en cuerpo... *jiva*... este no tiene posibilidad de llegar a la realidad... y escapar del cautiverio.



*Maestro del Universo... puede atraer a un jiva... y efectuar la unión.*



Nosotros... con nuestro entendimiento limitado... ni siquiera podemos escuchar comprensivamente... las palabras del Maestro.

Pero en la plenitud del tiempo... cuando a Dios le place... Él hace que se efectúe un encuentro... entre un alma en cuerpo... *jiva*... y un Satguru. Quien establece su contacto... con el Verdadero... *Naam*. El Poder de Dios... o Dios en Acción. La Primordial Corriente del Sonido.

Por medio de la cual... un alma es gradualmente conducida... hasta alcanzar la fuente... y el manantial del Verbo. *Shabd*. O la Corriente del Sonido.



*Quienes no sirven a la Verdad... se marchitan como un cañizo roto.*
*¡Oh Nanak! Aquel a quien el Maestro bendice... queda enlazado con el Naam.*
*Tan solo con mérito especial... encuentra uno a un Satguru.*
*Y Él procura una unión... entre el Surat... y el Shabd.*



Encontrarse con un Maestro... es un don puro de Dios. Y así... es la unión con Hari Naam. Dios.

El Maestro se asemeja a Dios... aunque en vestimenta física. Él también está dotado... de los mismos atributos de Dios Mismo.

Él también viene a salvar a los pecadores... y a administrar Su Gracia Salvadora... entre los demás.

Él lava a las almas en cuerpo... *jivas*... hasta dejarlas limpias de pecado. Y les da el regalo del *Naam*... que actúa como un remedio soberano... contra toda enfermedad. Física. Mental. Y espiritual.



*Mi Maestro quita todos los pecados... y yo dependo de Él.*
*Perdona mis culpas... ¡oh Maestro!*
*Nanak ora solo por esto.*



Grandiosas son las bendiciones... de un Maestro Perfecto.



*Con la adoración a Hari... viene la eterna bienaventuranza.*
*La unión con el Señor... es el don de un Maestro Perfecto.*
*Perdonado eternamente... yo ahora me remonto sin limitaciones... y libre.*



El poeta inglés del siglo diecisiete... Dryden... hablando de Cristo... nos dice:

*Mira a Dios descendiendo en tu forma humana.*
*El ofendido... sufriendo en nombre del ofensor.*
*Mira que todos tus delitos... a Él le son imputados.*
*Y toda Su rectitud... a ti se te transmite.*



La gracia del Maestro... es tan ilimitada como Su grandeza.

Tanto así... que Él perdona aun a aquellos que hablan mal de Él. Y los acepta... como Suyos propios.



*El que habla mal del Maestro... puede aun dar la vuelta... para encontrarse con Su gracia salvadora... que lo conduce a Su rebaño.*



Incontables son las personas... cuyos pecados son perdonados. Y a quienes se les hace cruzar a salvo... el mar de la vida.

Con el *Shabd*... Él quema hasta convertirlas en cenizas... las impresiones kármicas de muchas almas.

Igual que un capitán... pilotea el barco... esquivando muchos bancos de arena.



El Maestro verdaderamente es Dios.

Él es un mar... con oleadas de compasión.

Toda clase de regalos... fluyen eternamente de Él... como manantiales perennes... de agua fresca y refrescante.



*Narain... Creador... en el Guru... es compasión encarnada... y un verdadero amigo.*
*En Su placer está todo.*
*Y Nanak es un sacrificio... que a Él hace de sí mismo.*



El mayor regalo de Dios y del Guru... es tan solo una cosa. El Verbo. *Naam*.

Ellos siempre otorgan a Sus devotos... las bendiciones del Verbo... *Naam*. Y así... efectúan su salvación.



*Los devotos de Dios... siempre se regocijan en el Naam.*

*Tan solo contemplarlo... es una bendición poco común.*
*Los que son verdaderamente bendecidos... pueden obtenerla.*
*Con la misericordia del Misericordioso... el Satguru confiere el don del Naam.*



En este mundo... y más adelante... no hay regalo más grande... que el Verbo. *Naam*.

Inapreciable es el tesoro del *Naam*. Uno que sea Verdadero... puede otorgarlo a Su voluntad.

Uno puede asegurarse el regalo del *Naam*. Y encontrar con ello... un acceso a Dios... por medio del *Satsang*... y el *Satguru*.



*Todo aquel a quien el Maestro bendiga... puede tener el amor del Señor.*
*La compasión de Dios se conmueve... cuando uno es verdaderamente bendecido por un Sadh... oh Nanak.*



La gracia salvadora... viene por medio del contacto con el Verbo. *Naam*.

Y el continuo regocijo de Su amor... y de la gracia salvadora... ayuda a aquel contacto.

Ambos... gracia y Verbo... trabajan recíprocamente. Y ayudan a desarrollarse... uno a otro.



*¡Oh Nanak! El Naam viene solamente de la gracia.*
*No hay más amigo... que Ram Naam.*
*Elevándote por encima de los pares de opuestos... adhiérete al Naam... y Él te bendecirá.*

*Aquel que conoce Su hukam... no tiene ocasión de lamentarlo.*

Y el alma... *jiva*... tarde o temprano... tiene que alcanzar la meta. Es decir... la realización del ser... y la realización de Dios.



Sus palabras... cualesquiera que sean... llevan fruto en abundancia.

*Uno obtiene resultados del Verbo... Naam... con Su sola gracia.*
*Tu sola gracia... ayuda a desarrollar el poder de Naam.*
*Sin defecto alguno... uno está siempre ocupado en el Naam.*

### El cuidado del Maestro

La relación entre el Maestro y el discípulo... es de un carácter único. Y no le encontraremos paralelo... en la tierra.

Empero... los Santos han tratado de hacernos comprender... algo de ello.

Mientras que todas las conexiones y ataduras mundanas... están más o menos manchadas por el egoísmo... la relación entre el Maestro y el discípulo... es puramente de amor desinteresado.



Solo por analogía... podemos considerar el amor de una madre por su hijo.

Una criatura al nacer... es solo una masa desvalida... de carne tierna... y huesos.

No puede expresarse... ni expresar sus necesidades. Ni tampoco puede cuidarse.

Pero su madre cuida tiernamente... de ese pedacito de humanidad.

Ella atiende a cada una de sus necesidades... y procura su comodidad.

En su felicidad... descansa la felicidad de la madre. Y en sus tristezas... se siente ella angustiada.

Día y noche... trabaja incansable por el bienestar de la criatura. Y ningún sacrificio... es demasiado grande para ella.

Se niega todo a sí misma... para que su pequeñín... tenga todo lo que ella le pueda proporcionar. Y aun está dispuesta... a darle su vida.



Conforme va creciendo... empieza a embeberse en el amor de su madre.

Los bondadosos rayos de amor... pasan de unos ojos a otros.

En un lenguaje mudo... él empieza su primera lección de amor.



El discípulo tiene que ser jalado... por encima de sus sentidos... mente... e intelecto. Y esto... nadie lo puede lograr... sino un Maestro.

Detener el curso del enorme torrente de las corrientes sensorias... que fluyen precipitadas al mundo... y mantenerlas en un centro... es en sí... una tarea gigantesca.

Y el siguiente trabajo del Maestro... es aún más importante que este.



Después del proceso preliminar de limpieza... Él extirpa escamas del ojo interno. Y le da visión... y Luz.

Y rompe el sello del oído interno... haciendo que el alma... *jiva*... escuche la música interna del alma.

Por medio de Su atención y cuidado individuales... de basura y desperdicios... hace un adepto... capaz de comprender y disfrutar del lenguaje que no se habla. Y de la ley de Dios que no está escrita.

Así como de ejecutar acciones... sin ayuda de órganos... y facultades externas.



*Bendito es en verdad el Maestro.*
*Quien con Sus instrucciones... nos purifica de todo a todo.*
*El Satguru corta en dos... todos los grilletes de los discípulos.*



Igual que Wordsworth cantó de su hermana... canta un discípulo a su Maestro:

*Ella me dio ojos. Ella me dio oídos.*
*Y humildes cuidados... y suaves temores.*
*Un corazón que es fuente de dulces lágrimas.*
*Y amor... y pensamiento... y alegría.*



El Maestro siempre salva a Sus discípulos... por muy peligrosa que sea la situación... en que se encuentren.

Sus brazos protectores... sirven de escudo y resguardo. Y el discípulo lleva una vida encantada... por decirlo así.

El Maestro hace todo esto... sencillamente porque se ha hecho cargo de un alma... *jiva*.

No existe obligación alguna de parte del discípulo. Ni tiene necesariamente... que saberlo.



Además... el Maestro toma sobre Sí... la carga de los pecados e iniquidades del discípulo.

Todos sus delitos... a Él se le imputan. Y toda Su rectitud... se te pasa a ti.

Él toma en Sus propias manos... todo el proceso de desenredar las impresiones kármicas del alma.

Habiéndolo liberado del plano sensual... por la inversión de su corriente sensoria... a fin de que esta fluya hacia arriba... el Maestro lo incapacita... para sembrar más semillas kármicas... para futuras cosechas.

Y cualquier violación que aun pudiese cometer... a causa de la debilidad de la carne... el Maestro mismo... suave y firmemente... se ocupa de ella aquí en la tierra. Sin dejar ningún saldo deudor... que tuviese que pagar.

De esta forma... la cuenta del *Kriyaman karma*... las acciones del presente... queda saldada y justificada.



Luego siguen los karmas *Pralabdha*. Que determinan lo que llamamos destino... o suerte. Y por cuya causa... venimos al mundo.

El Maestro no los toca. Y el discípulo alegremente... va entretejiendo su camino... a través de su tiempo de duración.

Mediante la compasión del Señor... todas las pruebas y tribulaciones vuelan. El mismo Satguru... salva al *jiva*... de todo daño.



Por último... no por ello lo menos importante... el Maestro alimenta al alma... *jiva*... con el Pan de la Vida. Y sacia su sed... con el Agua de la Vida. *Naam*.

Hasta que crece... y llega a ser un adolescente espiritual... capaz de tener cierta seguridad en sí mismo.

El toque de la chispa del *Naam*... Dios en Acción... o el Poder Controlador de Dios... quema totalmente el almacén del karma... que no ha fructificado... de eras y eras del pasado. *Sanchit*. O almacén de karmas. Incapacitándolo... para germinar en el futuro.



*El Satguru mantiene a Su discípulo... sikh... de maná y elixir.*
*Así de bondadoso es el Maestro... con Su discípulo.*



*Yo soy el Pan de la Vida.*
*Aquel que venga a Mí... nunca tendrá hambre.*
*Y el que crea en Mí... nunca tendrá sed.*

Juan, capítulo seis, versículo treinta y cinco.



El cuidado protector del Maestro... es mucho mayor... que el de una madre para con su hijo.

El Maestro siempre mantiene Sus ojos amorosos... en Su discípulo. Y lo resguarda de todo lo que es dañino. Pues Su amor... no conoce límites.



*Así como una madre atiende a su hijo... y siempre cuida de él.*
*Le da alimento... y lo nutre... para que crezca bien.*
*Así cuida el Maestro... de Su amado... con amor divino.*
*Así como la madre ama al hijo... y el pez al agua... así ama el Maestro... a Su propio discípulo.*



A este respecto... la distancia no tiene consecuencia alguna. Ni cuenta... para el Maestro.

Su brazo largo y fuerte... puede llegar a cualquier parte. Y Su mirada penetrante... puede atravesar todo el espacio.

Su mano es la mano de Dios. Y el poder de Dios... trabaja por medio de Él.

Maulana Rumi.



Dondequiera que el discípulo esté... por muy extremas que sean sus circunstancias externas... el Maestro está con él. Y lo guía a cada paso. Pues esa... es Su eterna promesa.



*Hombre... Yo iré contigo... y seré tu guía.*
*Para estar a tu lado... en tu mayor necesidad.*

De manera similar... el Maestro siempre tiene a Su discípulo... dentro de su mirada penetrante. Nutriéndolo con el Agua de Vida. La semilla del Verbo.



Cargo al espíritu que parte... y guiarlo al mundo nuevo. Al tribunal de Dios.

Después... el Maestro lo lleva a la región... que Él considere mejor... para mayor disciplina... y progreso en el Sendero.



*Sirve al verdadero Satguru... y guarda con celo la riqueza de la Verdad.*
*En el último momento... Él vendrá a rescatarte.*
*Únicamente es un amigo... aquel que me acompaña en mi último viaje.*
*Y está a mi lado... ante el tribunal de Dios.*
*Mi Maestro es el todo... y la fuente de todo consuelo.*
*Él me enlaza con el trascendental Brahma... y al final viene en mi ayuda.*



Maulana Rumi dice:

*¡Oh, tonto ignorante! Con presteza... aférrate a un guía.*
*Pues entonces... estarás a salvo... de los horrores del Más Allá.*



Todos nuestros vínculos y conexiones mundanas... tienen carácter efímero.

Algunos nos abandonan en la pobreza. Algunos en la adversidad. Otros... en la enfermedad.

*¡Oh Nanak! Corta las ataduras del mundo... y encuentra algún amistoso Santo.*
*Los apegos del mundo te abandonarán... más durante la vida.*
*Mientras que el Otro... se mantendrá firme contigo... en la muerte... y más allá.*



Un alma despertada a la Realidad por un Satguru... no puede ser una presa... de los mensajeros de la muerte.

Sino que tiene que ir... con la Forma Radiante del Maestro. Que viene a recibirla... cuando desecha su vestimenta física.

*El oro no atrae al óxido... ni el acero a los gusanos.*
*El discípulo del Maestro... nunca irá al infierno.*



El Maestro es en verdad el Maestro... tanto en este mundo... como en el siguiente. Y ayuda al alma... en ambos mundos.

Maulana Rumi dice de Él:

### Auto-entrega (del propio ser)

Entregarse a los pies del Maestro... significa fusionar la voluntad individual de uno... en la Voluntad del Maestro. Y ponerse uno completamente... a Su misericordia.

Es la forma más segura... y más sencilla... de escapar de toda preocupación... y ansiedad.

Esto viene únicamente... cuando un discípulo tiene completa fe... y confianza... en la competencia del Maestro.



Este tipo de entrega del propio ser... se asemeja al de un paciente completamente desvalido. Que... confiando en la destreza de un cirujano competente... coloca su vida en sus manos. Y tranquilamente se somete... a su bisturí... y a su lanceta.

También se puede comparar... a la confianza que otorga el viajero irremediablemente perdido... en su espeso bosque. Al guardabosque... que lo encuentra... y lo saca de ahí.



Exactamente en la misma forma... el trabajo del Maestro no consiste simplemente... en enseñar la teoría de la Ciencia del Más Allá. *Para Vidya*.

Sino que incluye... la demostración práctica de los resultados... de experimentos espirituales. Y la ayuda... y la guía... en todas las dificultades del discípulo.

Un verdadero amigo... no solo da lecciones teóricas... sobre cómo escapar de la mente y de la materia. Sino que ayuda a llevar a cabo... esta escapatoria.



En este contexto... tenemos el testimonio de Hafiz. Un gran poeta sufi de Persia... quien declaró:

*Tiñe tu alfombra de oración en vino... si así lo desease el Maestro.*
*Pues Él no ignora las vueltas del camino real... que está adelante.*



Cuando un discípulo confía todo al Maestro... se queda libre de preocupaciones. Y el Maestro tiene por necesidad... que tomar sobre Sí... toda la responsabilidad. Igual que una madre lo hace... por su criatura... que no sabe lo que es bueno para ella.

Al ir progresando el discípulo en sus prácticas espirituales... *sadhan*... se va capacitando... para recibir más gracia del Maestro.

Bajo Su bondadosa y benigna influencia... el discípulo empieza a prosperar de día en día. Y todos sus deseos... se cumplen... sin la menor dificultad de su parte.



Los sabios y videntes gritan desde los tejados:

*Ustedes... buscadores de la paz... apresúrense a ir... con un Santo Maestro.*



En el discurso diecisiete... verso sesenta y seis... del *Bhagavad Gita*... el bendito Señor Krishna... como instructor del mundo... anuncia:

*Abandona todos tus deberes... y ven a Mí... el único refugio.*
*Yo te liberaré de todo pecado.*
*No te aflijas.*



En el Sagrado Corán tenemos igualmente:

*Quienquiera que entregue su voluntad a Alá... mientras está haciendo el bien... su recompensa está con el Señor.*
*Y ningún temor le asaltará.*
*Ni tampoco se afligirá.*



Y en la Biblia encontramos:

*Y yo pondré mi mano sobre ti... y simplemente purgaré impureza.*
*Y toda tu escoria... quitaré.*

Isaías, capítulo uno, versículo veinticinco.



*Vengan a Mí... todos ustedes que sufren... y están pesadamente cargados.*
*Y Yo les daré descanso.*

Mateo, capítulo once, versículo veintiocho.



También:

*Llámame en el día de aflicción.*
*Yo te liberaré.*



La entrega del propio ser... no es tarea fácil.

Para lograrlo... uno tiene que regresar al estado de un niño inocente. Lo que significa una total involución. Una completa metamorfosis. Suplantando la propia individualidad.

Es el Sendero de la abnegación. Que no todos... podemos seguir.



Por otro lado... el sendero de la disciplina espiritual... es comparativamente fácil.

El esfuerzo propio... lo puede tratar de hacer cualquiera... a fin de lograr un progreso espiritual.

Este es sin duda... un sendero largo y tortuoso... comparado con el camino de la entrega del propio ser. Pero uno puede... con confianza en el Maestro... andar sobre él... firmemente... paso a paso.

Sin embargo... si una persona es lo bastante afortunada... para decidirse por la entrega del propio ser... puede recibir rápidamente... todas las bendiciones del Maestro. Ya que va directamente a Su regazo. Y nada tiene que hacer para sí... por sí misma.

Él es entonces... el elegido del Maestro. Su hijo amado. El hijo de Dios Mismo.

Pero muy raramente... aun un alma realmente bendecida... puede ser capaz de lograr esta actitud.



*Si el Señor así lo ordenare... entonces... ¡oh Nanak!... puede una persona tomar el sendero de la entrega del propio ser.*
*Bendito en verdad... es el que se entrega a los pies del Satguru.*
*Estando cerca de la Verdad... se regocija en la Verdad... y fácilmente se fusiona con la Verdad.*
*¡Oh Nanak! Es con la gracia del Señor... como uno puede encontrar un Gurmukh tal.*



En las escrituras... uno encuentra un gran número de ventajas... por adoptar este Sendero:

*Todos los males y tristezas se desvanecen... al entregarse a los pies del Maestro.*
*En el mundo de alegrías y tristezas... solo escapa el que gane los pies del Satguru.*
*Un Gurmukh está separado de los tres gunas... y es aceptable al Señor.*
*En la auto-entrega... la mente se purifica. Pero entonar solamente el Nombre de Dios... no sirve de ayuda.*
*Para el bien del mundo... vienen aquellos que tienen sed de ver al Señor.*
*Quien se entrega... escapa definitivamente... con todos sus deseos cumplidos.*
*Todas las alegrías están con el Satguru. Inclínate pues... a Sus pies. Solo verlo... es una bienaventuranza.*
*Sin pena... canta alabanzas para Él.*
*Yo veo que el mundo... está siendo consumido por el fuego del egoísmo.*
*Escápate entregándote al Maestro... y luego... ocúpate del verdadero Shabd.*
*Yo me entrego a Aquel... quien es la única causa... material... y eficaz.*
*Su gracia ha dejado ver la tierra nativa... a la luz de la luna.*
*Con un impulso de Vida de un Maestro perfecto... Ram Naam descansa en mí.*
*¡Oh Nanak! Con la entrega a los pies del Maestro... el Señor Mismo... se vuelve misericordioso.*



En *Kali Yuga*... el *Naam* está escondido en todas partes. Y el Señor lo compenetra todo... en plenitud.

Pero el precioso *Naam*... se manifiesta... en quien se entregue al Maestro.



*Con las bendiciones del Maestro... uno pierde el temor a la muerte... y es llevado con éxito... a través del mar de la vida.*
*Alegremente conquista a la muerte... y nunca va al infierno.*
*¡Oh Nanak! Él se salva por medio de la entrega... pues Hari lo toma bajo Su cuidado.*
*Habiendo sido aceptado por el Aceptador... todos sus actos se vuelven puros.*
*¡Oh Nanak! Él nunca irá al infierno. Tal es el regalo de la entrega.*
*Nadie sino el elegido... se encauza en la devoción al Naam.*
*¡Oh Nanak! Con la entrega a los pies del Maestro... uno nunca va y viene.*
*Al dispersador de los males... y Señor de todo... se le alcanza mediante la entrega a un Sadh. Y se cruza rápidamente... el mar tumultuoso de la vida.*
*Cuando un alma en cuerpo... jiva... se entrega al Satguru... el Señor la toma bajo Su propia protección. Y le concede las bendiciones de la eterna felicidad. Sehaj.*
*Toda duda y todo temor desaparecen.*
*Y alcanza él... su propio Ser verdadero.*

#### Elementos claves que resalten de cada capitulo para hacer énfasis en el aprendizaje

- Entregarse al Maestro... es fusionar la propia voluntad en la Suya... y ponerse a Su misericordia.
- La entrega es el camino más seguro y rápido... pero exige volverse como un niño inocente.
- Es el Sendero de la abnegación. Quien se entrega... recibe todas las bendiciones del Maestro.
- La entrega no excluye el esfuerzo... pero el éxito... depende de la gracia.
- En Kali Yuga... el *Naam* se manifiesta... en quien se entrega al Maestro.

### Las palabras del Maestro

Cuando una persona va a un Maestro... debe hacerlo con una mente abierta.

Puesto que sabe... que todas sus acciones hasta este momento... tanto individuales como sociales... no le han asegurado la salvación... debería decidirse... y pedirle al Maestro Sus instrucciones... en cuestión de prácticas espirituales.

Habiendo recibido Sus instrucciones... debe entonces seguirlas escrupulosamente. Y solo eso... debe constituir su única devoción.



Cualquier cosa que el Maestro ordene... debe tomarse como Verdad evangélica. Pase o no... la prueba del simple razonar humano.

Nuestro intelecto y nuestra razón... después de todo... son limitados. Y no pueden alcanzar las profundidades... a las que el Maestro penetra.

Él conoce el porqué... y el para qué... de Sus instrucciones. Y Él emite Sus órdenes... como un responsable Comandante de campo.

Tenemos por tanto... que aprender a obedecer al Maestro implícitamente... como verdaderos soldados. Y hacer... lo que nos pida.



Hafiz nos dice en este contexto:

*Tiñe tu alfombra de vino... si tu Maestro así lo desea.*
*Pues Él no ignora las vueltas del camino... que está adelante.*



La lealtad al Maestro... solo de palabra... nunca trae retribución.

El Maestro quiere devoción total a lo que dice. Pues en ello... descansa el último bien del discípulo.

En el Evangelio se declara enfáticamente:

*Si me aman... manténganse en Mis mandamientos.*

Juan, capítulo catorce, versículo quince.



*Hagan lo que dice la Palabra... y no sean solamente oyentes... engañándose a ustedes mismos.*

Santiago, capítulo uno, versículo veintidós.



Además... la simple charla sobre espiritualidad... no servirá de nada.



*Los escribas y los fariseos... se sientan en la silla de Moisés.*
*Pero no hagan ustedes... lo que ellos hacen.*
*Porque ellos hablan... y no actúan.*

Mateo, capítulo veintitrés, versículos dos y tres.



*Porque el Reino de Dios... no está en palabras... sino en la virtud.*

Primera de Corintios, capítulo cuatro, versículo veinte.



Así como el cuerpo sin el alma... es un armazón muerto... así el hablar... si es solo hablar... es un armazón muerto.

San Pablo dice:

*Si yo hablo con todas las lenguas de los hombres... y de los ángeles... y no tengo amor... vengo a ser como bronce que suena... o un címbalo que tintinea.*

Primera de Corintios, capítulo trece, versículo uno.



Lo mismo se puede decir... de la mirada del Maestro... o *darshan*. O del hecho de estar mirando al Maestro.

Esto les podrá dar temporalmente... paz y quietud mental. Pero en el momento en que se alejen... la mente empieza de nuevo a vagar alocadamente. Y a reinar en forma absoluta... sobre el cuerpo y el alma.

Así... nada cuenta en el Sendero de los Maestros... sino el actuar... y cumplir.

Las palabras del Maestro penetran profundamente en el corazón. Difícilmente puede uno pensar... en no obedecerlo.



*Si se mantienen en Mí... y Mis palabras permanecen en ustedes... todo lo que deseen... se les concederá.*
*En eso es mi Padre glorificado... en que produzcan mucho fruto... llegando a ser así... mis discípulos.*

Juan, capítulo quince, versículos siete y ocho.



*Pero quien recibe semilla en tierra buena... es el que oye la Palabra... y la comprende.*
*La cual fructifica... y una produce un ciento... otra sesenta... y otra treinta.*

Mateo, capítulo trece, versículo veintitrés.



Al mundo se le compara con una cosecha. Mateo, capítulo trece, versículo treinta.

Y a los hombres que cosechan... nada les importa... sino el fruto.

Acepten las palabras del Maestro... como Verdad evangélica. Y cosechen bien... el fruto de la Vida.



Las palabras del Maestro... no se pueden separar del Maestro.

Es de lo que abunda en el corazón... de lo que la lengua habla.

El Maestro está incrustado en el Verbo. Y Sus palabras... son la expresión de lo que hay en Él. Es decir... Verbo... Impulso de Vida... y Poder.

¿Cómo pueden entonces... estar separados?

Indudablemente... Sus palabras penetran en los corazones de los aspirantes. Y nadie más... puede conocer los dulces tormentos... que les hacen sufrir.



*Cuando el anhelo por el Señor se agudiza... las palabras del Maestro penetraron en mi corazón.*
*Solo la mente conoce los dolores.*
*¿Quién puede conocer... los dolores de otro?*



Cuanto más importancia da uno a las palabras del Maestro... tanto mayor es la gracia.

La verdadera devoción al Maestro... consiste en la aceptación de lo que Él ordena... y en cumplirlo.

Ram Das nos exhorta... a que nuestro pensamiento en el Maestro... sea siempre un compañero. Sin que importe... lo que uno esté haciendo.



*El Maestro está oculto en Sus palabras.*
*Y Sus palabras... son de hecho... el verdadero Maestro.*
*Sagrado es el Verbo del Maestro.*
*Y por medio de Él... uno recibe el Elixir de Vida.*
*Pues la aceptación de Sus palabras... le da a uno... vida inmortal.*
*Recuerda siempre al Verbo del Maestro.*
*Porque en ello... descansan la devoción... y la verdad.*
*Actúen de acuerdo a la palabra del Maestro.*
*Esto constituye... la contemplación correcta.*



El Verbo del Maestro... siempre mora en los iniciados. Y ningún poder sobre la tierra... puede arrebatarlo.

El fuego no puede quemarlo. Ni el agua... arrastrarlo.

Es indestructible... e inmortal.

Él adopta como hijo... a quien no tiene padre. Y nos protege... a cada paso.

Llega hasta la raíz de toda duda... y escepticismo.

Ni el ángel de la muerte... puede acercársele.



*Entra en contacto con Ram Naam... por medio de las instrucciones del Maestro.*
*Este néctar... puede gozarse en la compañía de los Santos.*
*Encuentra el lugar natal... con la ayuda del Maestro.*
*Entonces... ya no habrá más ir... y venir.*



Uno no puede obtener el tesoro del Naam... Verbo... ejecutando acciones en el plano de los sentidos.

Todas las personas... sin duda... entonan y escuchan el *Gurbani*. Pero únicamente reciben su beneficio... quienes creen en las palabras del Maestro... como Verdad evangélica.



*Sirvientes y discípulos... al llegar al Maestro... entonan los versos sagrados de escrituras sagradas.*
*Entonar y escuchar... solo es aceptable... de todos los que con fe... aceptan las palabras del Maestro.*



Protección a sus antepasados... así como a sus descendientes. Y no tiene nada... por qué temer.



*Bendito es en verdad el nacimiento... de aquellos que cumplen con la voluntad del Maestro.*
*Pues salvan a sus familias... y dan abundante gloria a sus madres.*
*Aquel que se moldea a sí mismo... en la forma de ser del Maestro... nunca recibe mal alguno.*
*En su camino está el estanque del Néctar... y llega fácilmente a Él.*
*Un discípulo que cumple con la Voluntad del Maestro... recibe el Elixir de Vida por su propio derecho... y gana el Reino de Dios... por derecho de nacimiento.*
*¡Oh hombre! Cumple con la voluntad de tu Maestro.*
*Mora en tu hogar natal... y goza de vida eterna.*
*¿Quién comprende la Voluntad del Maestro... y la cumple escrupulosamente?*
*Aquel en quien está actuando la gracia del Señor.*
*Solo acepta y sigue las palabras del Maestro... aquel en quien la gracia del Señor... está actuando.*
*No hay persona más grandiosa... que aquel que... aceptando las palabras del Maestro... realiza a Dios.*
*Por tanto... debemos aspirar por el Verbo... y tratar de asegurar un contacto con Él... por medio del Sant Satguru.*
*¡Oh mente! Recuerda siempre las palabras del Señor.*
*Aquel que... por medio del Verbo... alcance su hogar natal... es la joya más valiosa entre los hombres.*
*Las bendiciones del Verbo de Dios... Hari Naam... son demasiado numerosas para contarse.*
*El que llegue a estar teñido en el color del Verbo... siempre canta las glorias de Dios.*

#### Elementos claves que resalten de cada capitulo para hacer énfasis en el aprendizaje

- Las palabras del Maestro... deben aceptarse como Verdad evangélica... y cumplirse escrupulosamente.
- La lealtad de palabra no basta. Hay que actuar... y cumplir.
- Las palabras del Maestro... son el Verbo mismo. No pueden separarse de Él.
- Aceptar Sus palabras... otorga vida inmortal... y conduce al hogar natal.
- El Verbo del Maestro es indestructible. Ni el fuego... ni el agua... pueden arrebatarlo.
