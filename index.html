## Presentación

Este libro, *Hombre = Dios*, reúne las enseñanzas de Kirpal Singh. Habla de la naturaleza del Maestro perfecto. Del Hombre-Dios. Del *Sant Satguru*.

A lo largo de sus páginas se explica quién es el Maestro. Por qué es imprescindible en el camino espiritual. Y cómo su manifestación... es el Verbo hecho carne.

Esta obra ofrece un mapa completo para el buscador sincero. Desde el reconocimiento del Maestro viviente... hasta la entrega del propio ser. La gracia. El cuidado protector. Y las palabras que conducen al alma... de regreso a su Hogar celestial.

## Sobre el Autor

Sant Kirpal Singh nació en 1894... en Punjab, India. Fue un místico contemporáneo. Iniciado por Hazur Baba Sawan Singh Ji en 1924... dedicó su vida a la Surat Shabd Yoga. La Ciencia del Alma. Y trabajó por la unidad de las religiones.

Fundó la Confraternidad Mundial de Religiones. Viajó por el mundo... impartiendo la iniciación en el Verbo interior. *Naam*.

Su vida fue un ejemplo. Un ejemplo de humildad. De amor. Y de servicio desinteresado.

## Introducción

Esta obra arroja luz sobre un tema que ha desconcertado a la humanidad. La relación entre Dios... y el Maestro encarnado.

A través de testimonios de diversas tradiciones —hinduismo, sijismo, cristianismo, sufismo—, Kirpal Singh muestra que el Maestro viviente... es el polo humano donde la Energía divina se manifiesta. Para guiar a las almas de regreso a Dios.

Este libro busca disipar el temor a la muerte. Y ofrecer un camino de experiencia directa... de la Verdad.

## Sant Kirpal Singh

El autor relata su vivencia de veinticuatro años... junto a su Maestro. Hazur Baba Sawan Singh Ji Maharaj.

Presenta al Hombre-Dios como un Comisionado de lo alto. Un Comisionado que otorga el regalo del Verbo. *Naam*. La melodía refulgente... que conduce al alma al Hogar del Padre.

Sin el toque vivificante del *Satguru*... el alma no puede despertar. No puede sintonizarse con el Verbo.

El Maestro... es el Verbo personificado. El Verbo... que habita entre nosotros.

### El Maestro (Guru): Lo que es

Es mucho... que el hombre fue hecho a semejanza de Dios. Pero, que Dios fuese hecho semejante al hombre... es aún más.

Dios se vistió de vil carne humana. Y así pudo ser lo bastante débil... para sufrir infortunio.

— John Donne



Es casi imposible... conocer al Maestro. Y más difícil aún... comprender Su grandeza.

No tenemos los ojos... para contemplar Su realidad. Solo un profeta puede conocer a un profeta.

Nosotros... somos espíritus revestidos de un cuerpo. Vivimos en el plano de los sentidos. Sencillamente... no Le podemos conocer.



*Lo que Tú eres... no lo sabemos.*
*¿Qué es lo que más se Te asemeja?*

Y se pregunta también:

*¿Cómo puede lo inferior... comprender a lo Grandioso?*
*¿O la razón finita... alcanzar la Infinidad?*
*Pues lo que a Dios pudiese desentrañar... sería más que Él.*

— Dryden



En el *Jap Ji* —la oración matutina diaria de los sikhs— se menciona:

*A menos que uno se eleve al nivel Suyo... uno no puede conocerlo.*



A un Alma Maestra... se le puede comparar con una alondra. Se describe así:

*¡Trovador etéreo!*
*Peregrino del Cielo.*

Quien puede remontarse tan alto como la alondra... y seguir su curso... puede conocer algo del peregrino etéreo. Pero los pobres cuervos... y las palomas... no pueden hacerlo.

El Maestro, sin embargo... no es un peregrino del cielo. Es un ciudadano del más elevado reino espiritual. De donde desciende... para cantarnos el Canto Etéreo. Y para llevarnos consigo... a Su morada celestial.



Mientras está en la tierra... Él es:

*Como el sabio... que se remonta pero nunca vaga.*
*Fiel a los afines puntos del Cielo... y al Hogar.*



Él está mucho más allá... de las limitaciones de los tres cuerpos. Físico. Astral. Y causal.

Está más allá de las tres tendencias... o instintos innatos. *Satva*. *Rajas*. *Tamas*. Es decir... acciones rectas... acciones mundanas... y acciones nacidas de la ignorancia y la oscuridad.

Está más allá de los cinco elementos... de los cuales está hecha toda la creación. Tierra. Agua. Fuego. Aire. Y éter.

Está más allá de los veinticinco *prakritis*... las formas sutiles de las que los elementos se componen.

Y está también... más allá de la mente... y de la materia.



Por eso, Shamas-i-Tabrez describe al Maestro así:

*Él es una alondra... que pone un huevo dorado.*

Un huevo que brilla como oro sólido. Es una referencia a la Luz del Verbo. A *Naam*. La Luz que se otorga a cada individuo... al momento de su iniciación.



Sheikh Mueen-ud-din Chishti dice:

*Ellos... las Almas Maestras... viven en el mundo.*
*Mas Su espíritu... está siempre en los Altos Cielos.*
*Presos en los tentáculos del cuerpo...*
*Su espíritu se remonta... muy en alto.*



Maulana Rumi también dice:

*Nunca tomes a un Hombre-Dios... a nivel humano.*
*Pues Él es mucho más... de lo que aparenta.*



Aparentemente... todas las personas se ven iguales. Pero cada una difiere de la otra... en su desarrollo interno.

Es este antecedente... el que ayuda a cada individuo sobre el Sendero Espiritual. Determina la medida de cada paso que da. Y, consecuentemente... cada uno tiene su factor de tiempo.



Un Alma Maestra en forma humana... no puede ser debidamente comprendida.

El Maestro es un océano ilimitado de Verdad. *Sat*. Siempre la misma. Desde el principio de la creación... y de era en era.

Así como no es posible hacer justicia a la grandeza de Dios... tampoco podemos hacerle justicia al Elegido de Dios.

Un Santo persa nos dice:

*Él está más allá de la comprensión.*
*De la aprehensión.*
*De la concepción.*
*Y aún... de la conjetura.*
*Sobrepasa las facultades de visión... audición... y entendimiento.*
*Todas las glorias que pudieran cantarse sobre Él...*
*Durante toda la vida... no le harían justicia alguna.*



Y añade:

*Si todas las montañas se trituraran... hasta convertirlas en tinta...*
*Mezclándolas con las aguas de los océanos...*
*Y toda la tierra fuera una hoja de papel...*
*No podría registrarse en ella... la grandeza de un Maestro.*



Él es el Rey de la Espiritualidad.

Y nosotros... arrastrándonos cual insectos en el estiércol del mundo... no podemos conocerlo a Él. Ni a Su grandeza.

Maulana Rumi dice:

*Si yo entonase alabanzas de Sus incontables bendiciones...*
*Hasta la Eternidad...*
*Difícilmente podría decir algo de ellas.*



Lo que decimos de Él... lo hacemos a un nivel intelectual. Y ese nivel... tiene un alcance muy estrecho. Muy limitado.

Todos nuestros esfuerzos en esta dirección... tienden a desacreditarlo. En vez de darle algún crédito.

Por eso, Guru Arjan dice:

*Tú eres un Rey... y yo me dirijo a Ti como a un anciano.*
*Lejos de hacerte un honor... Te traigo descredito.*



El intelecto más elevado... el más sutil... que intenta describirlo... es como un niño. Un niño que, de pie ante su madre, le dice:

*¡Oh, mi querida! ¡Yo te conozco!*

¿Qué tanto puede saber él de su madre... cuando nada sabe de sí mismo?

Sus dulces balbuceos... no pueden hacerle justicia alguna al profundo amor... y afecto maternal... que abriga su pecho.

Tampoco nosotros podemos cantar las glorias del Maestro. No podemos conocer... ante el obstáculo del intelecto... a Quien está más allá de todas las barreras. Y de todas las limitaciones.



Benditos somos en verdad. Porque las Almas Maestras... los Maestros... cuando hacen Su aparición... a veces nos hablan de Sí mismos.

Es por medio de Sus palabras... tan raramente expresadas... que podemos conocer algo de Su grandeza. Y de la fuerza potencial... que trabaja a través de Ellos.



En incontables formas... por parábolas y otros medios... nos hablan de lo que son. De cuál es Su misión. De dónde vienen. Y de cómo llevan a cabo... el Plan de Dios.

Sería recomendable... que fuésemos ante Ellos... y escucháramos... lo que tienen que decir sobre Sí mismos.

#### Elementos claves que resalten de cada capitulo para hacer énfasis en el aprendizaje

- El Maestro es una realidad infinita e ilimitada. No puede ser comprendido con los sentidos... ni con la razón finita.
- Solo un profeta puede conocer a un profeta. Para entender al Maestro... hay que elevarse a Su nivel.
- El Maestro es descrito como una alondra celestial. Desciende a la tierra... para cantar el Canto Etéreo... y llevarnos a Su morada.
- Él está más allá de los tres cuerpos... de las tres gunas... de los cinco elementos... y de las limitaciones de la mente y la materia.
- Su grandeza es inefable. Si todas las montañas se hicieran tinta... y la tierra papel... no bastarían para describirla.

### El Maestro es el Verbo (Guru es Shabd)

El Evangelio de San Juan comienza con las memorables palabras:

*En el principio era el Verbo... y el Verbo estaba con Dios... y el Verbo era Dios. Él estaba en el principio con Dios.*

San Juan, capítulo uno, versículos uno y dos.



El Gurú es *Shabd*... o Verbo personificado. *El Verbo se hizo carne... y moró entre nosotros*, dice el Evangelio.

El Verbo o *Shabd*... es solo un rayo de Dios. Un rayo del gran Océano de Conciencia. Y este rayo único... es el responsable de la creación... y el sostenimiento de todos los planos... que forman el universo.



En el Evangelio de San Juan leemos más adelante:

*Todas las cosas fueron hechas por Él... el Verbo... y sin Él no se hizo nada de lo que fue hecho. En Él estaba la vida... y la vida era la luz de los hombres. Y la luz brilló en las tinieblas... y las tinieblas no la comprendieron.*

San Juan, capítulo uno, versículos uno al cinco.



Dryden, en su fantasía poética... se refiere al Verbo como Armonía... o el Principio del Sonido:

*De la Armonía... de la Armonía Celestial... esta forma Universal comenzó.*
*A todo lo largo de la escala de las notas recorrió.*
*Cerrando el diapasón completo... en el hombre.*



En el Gurbani tenemos:

*El Verbo es el Maestro... el espíritu es el discípulo del Verbo.*
*El Verbo es el Maestro y el Profeta... lleno de sabiduría honda... profunda.*
*Sin el Verbo... el mundo no puede existir.*
*Entre el Verbo y el Maestro... no hay distinción alguna.*
*El Verbo es en verdad... el Elixir de Vida.*



A quienquiera que siga al Verbo... según las instrucciones de un Maestro viviente... cruzará ileso el océano de la vida.



Tulsi Sahib dice:

*El espíritu es el discípulo... y el Verbo es el Maestro.*
*El espíritu encuentra el camino hacia Dios... solo después de ser conectado con el Verbo.*
*Al elevarse hasta el más allá... y penetrar en el pozo invertido.*



Bhai Gurdas habla del espíritu así:

*Es solo después de aceptar fiel y conscientemente al Dhunni... la Corriente del Sonido o Verbo... como Maestro... que el alma se convierte en un gurmukh... y sabe que el Verbo y el Maestro... son en realidad Uno solo.*



Sant Kabir, de manera semejante, explica:

*¿Dónde está el Maestro... y dónde mora el espíritu?*
*¿Cómo pueden unirse los dos?*
*Pues sin la unión... el espíritu no tiene descanso.*



Luego Él mismo se contesta:

*El Maestro está en el Gaggan... y también está ahí el asiento del espíritu.*
*Cuando los dos se unen... ya no hay separación después.*
*Acepta el Verbo como Maestro... todo lo demás es mero oropel.*
*Todo el que actúa egoístamente... va errante de lugar en lugar.*



Debemos aclarar que Gaggan... esotéricamente... es el cielo de Trikuti. La segunda región espiritual.



Es así como el Verbo o *Shabd*... es un Instructor del mundo... desde el principio del tiempo.

Bienaventurados son los puros de corazón... pues en ellos se manifiesta el Verbo del Maestro.

Este Verbo es el Santo verdadero... y puede actuar como un guía viviente. Es Dios-en-Acción. Y se expresa en abundancia... en las Almas Maestras... que son uno con Dios.



Se dice:

*Cuando agité el mar del cuerpo... un extraño fenómeno salió a la luz.*
*Dios estaba identificado en el Maestro... y ninguna distinción pudo Nanak encontrar.*



A quien es un hacedor del Verbo... se le llama Santo... o Alma Maestra.

Esta Verdad solo alborea... cuando se estudia el significado de la palabra *Guru*. Deriva de la raíz sánscrita *giri*... que significa: El que llama.

Por eso... a quien oye siempre ese llamado... y puede hacerlo manifiesto en otros... se le describe como *Guru* en el Gurbani.



Se dice:

*Acepta como Maestro a quien pueda hacer manifiesta la Verdad.*
*Dar expresión a lo Inexpresable... por medio del Sonido.*



Los teósofos le llaman la Voz del Silencio. Sus reverberaciones pueden oírse de plano en plano.

En la terminología de los Maestros... un Santo verdadero es el que puede dar enseñanza sobre el Verbo... *Shabd*. Sin un adepto... nadie puede recibir el don del Verbo... *Shabd* o *Naam*.

Puede comparársele con una escalera de cuerda... que conduce directamente hasta Dios. Y un espíritu... al acogerse a ella... puede fácilmente ascender hacia Dios.



Se dice:

*El contacto con el Shabd... es contacto con Dios.*
*Y bendito es quien hace contacto con el Shabd... internamente.*



También se dice:

*Dios en el Gurú... distribuye el Shabd.*
*Por contacto con la Verdad... uno se fusiona con la Verdad.*



Y también:

*¡Oh Nanak! Todos los Santos desde el principio... están incrustados en el Shabd.*
*Bendito es el Maestro Ram Das... quien también ha hecho contacto con el Shabd.*



En la Sagrada Biblia tenemos:

*El Verbo se hizo carne... y moró entre nosotros.*



Es de un adepto del Verbo... de quien uno recibe un verdadero impulso de vida.

Él mismo es uno con esa verdadera Corriente de Vida... de la cual todo lo animado deriva su vida.

Él es un residente de la región donde no hay ego. Él es el Verbo personificado. Vive... y tiene Su mismísimo ser en el Verbo... por haber cruzado mucho más allá del alcance de *kal*... o el Tiempo.

Vive la vida imperecedera. Y está capacitado para transmitírsela a otros... que entren en contacto con Él... y sigan Sus instrucciones.

#### Elementos claves que resalten de cada capitulo para hacer énfasis en el aprendizaje

- El Verbo... *Shabd*... es el único Maestro del mundo. El espíritu... *Surat*... es el único discípulo.
- *El Verbo se hizo carne y moró entre nosotros*. El Maestro es la personificación viviente del Verbo.
- El Verbo es la Corriente del Sonido primordial... responsable de la creación... y del sostenimiento del universo.
- El contacto con el *Shabd*... es contacto con Dios. Solo un adepto puede otorgar ese contacto.
- El Verbo actúa como una escalera de cuerda... que conduce directamente hasta Dios.

### Grados de Maestría

Los Maestros son de cuatro tipos diferentes. El padre. La madre. El preceptor o instructor. Y finalmente... el *Satguru*. El Guía Espiritual... o *Murshid-i-Kamil*.

De todos éstos... el *Satguru* es el instructor más grande... pues él imparte únicamente instrucciones espirituales.

A quien está versado en sabiduría mundana... se le llama preceptor... o *acharya*. Pues él nos da reglas de conducta social... y de vida ética.



Al *Satguru*... o Maestro de la Verdad... también se le conoce como *Sant Satguru*. Su relación con Sus discípulos es puramente espiritual. Ya que solo le concierne el avance del espíritu. Y no tiene nada que ver con los asuntos mundanos.



Desde el punto de vista de los logros espirituales... a los Gurus se les puede clasificar como: *Sadh*. *Guru*. *Sant Satguru*. Y *Param Sant Satguru*.



Un *Sadh* es el que ha ido más allá de la segunda región... Trikuti... u *Onkur*. Que significa lo mismo que *Lahut*... en términos sufíes.



Entonces viene otra Alma Maestra. Viene para reorientar esta antiquísima ciencia... según las necesidades de la era.

En esta forma... el vino viejo se mantiene en circulación... para las almas sedientas.

Tales Almas Maestras aparecen de tiempo en tiempo... en diferentes países... y entre gente diferente.



Además de los *Swateh Sants*... hay *Sants* que... mediante prácticas devocionales y disciplina espiritual... bajo la guía de algún Alma Maestra... adquieren mérito espiritual aquí... y se les otorga la comisión de trabajar como Guru.

Ya tienen abundantes antecedentes espirituales maduros para fructificar. Y en el presente lapso de vida... sencillamente parecen completar el proceso.

Los *Gurmukhs* están siempre formándose. Vida tras vida. Y adquieren la perfección en esta misma vida.



Kabir dijo que venía directamente del Reino de Dios... y que tenía un instrumento de instrucciones Suyas.

Bhai Gurdas, al hablar de Guru Nanak, nos dice:

*Primero recibió la comisión... y luego la desempeñó.*



Debemos aclarar que instrumento... esotéricamente... quiere decir tener comisión o autoridad... para impartir las instrucciones.



Resumiendo.

Los primeros vienen ya con autoridad. Y los últimos adquieren la autoridad estando ya aquí.

Pero no hay absolutamente ninguna diferencia... entre la grandeza de los dos. Ni en la naturaleza y el alcance de su trabajo. Ni en el método por el cual se hace el trabajo.

Cada uno de ellos está dotado de autoridad igual. Y lleva a cabo el gran plan de Dios... según las necesidades de la era... y de la gente.



Pero los demás... que pretenden esta posición... y posan y actúan como Almas Maestras... no solo se engañan a sí mismos... sino que desvían a las masas en general.

En esta categoría quedan incluidas aquellas personas que son codiciosas y egoístas. O que andan tras del nombre... y la fama.



Por diferentes modos y astucias innumerables... practican el engaño sobre los incautos y sencillos buscadores de la Verdad. Con la mira de servir a sus propios fines.

Es por causa de tales imposturas... que el papel de Guru está siendo mal visto por la mayoría de la gente. Y no es de extrañarse... que la ciencia de la Espiritualidad esté siendo estigmatizada... como un espejismo... y como un paraíso para tontos.

#### Elementos claves que resalten de cada capitulo para hacer énfasis en el aprendizaje

- Existen cuatro tipos de Maestros: padre... madre... preceptor... y *Satguru*. El *Satguru* imparte únicamente instrucción espiritual.
- Según los logros espirituales... los Maestros se clasifican en *Sadh*... *Guru*... *Sant Satguru*... y *Param Sant Satguru*.
- Algunos Santos nacen ya con autoridad. Son los *Swateh Sants*. Otros la adquieren mediante disciplina... y madurez espiritual.
- No hay diferencia esencial entre ambos. Cada uno lleva a cabo el plan de Dios... según las necesidades de la era.
- Los falsos maestros engañan a los buscadores... desacreditan el papel del Guru... y estigmatizan la espiritualidad.

### Un solo Maestro o muchos

El Verbo o *Shabd*... la primordial Corriente del Sonido... es el único Maestro para el mundo entero.

Y *Surat*... la conciencia individual... es el único discípulo. Ya que este último no puede prescindir del primero.

De hecho... existe el principio de unidad. Puesto que Dios es Uno Solo. Aunque Se haya manifestado diversamente.



Pero al mirar en sentido opuesto... y volvernos hacia el mundo... que abunda en formas diversas... vemos una estrella polar... que brilla en toda su majestad... reflejando la luz del Cielo.

Un alma tan pura... el Verbo hecho carne... u Hombre-Dios... con autoridad para impartir instrucciones espirituales a los buscadores de Dios... es tan Maestro como el Verbo mismo.

Porque él mismo es una personificación viviente del Verbo... *Shabd*. Y con el Verbo como su mercancía disponible... lo distribuye libremente... a quienquiera que Él desee.



Kabir dice de sí mismo:

*Vengo del Reino de Dios... para aplicar la Ley de Dios.*



Guru Nanak, también... fue investido de autoridad similar... para impartir instrucciones espirituales... cuando se encontraba en el desempeño de su misión.



Sin embargo... es de la mayor importancia... que al Maestro no se le cambie por ningún motivo.

La lealtad al Maestro... que ha iniciado al espíritu... y a Quien el espíritu ha prometido fidelidad... exige el reconocimiento de que el Maestro es competente... para impartir guía e instrucciones ulteriores. Aun cuando esté trabajando en el plano espiritual... después de haber dejado el mundo físico.

#### Elementos claves que resalten de cada capitulo para hacer énfasis en el aprendizaje

- Dios es Uno... pero se manifiesta diversamente. El Verbo es el único Maestro para toda la humanidad.
- Un alma pura con autoridad para impartir instrucción espiritual... es tan Maestro como el Verbo mismo.
- La lealtad al Maestro que ha iniciado al espíritu... debe ser única e irrevocable.
- El Maestro continúa guiando incluso después de dejar el plano físico... a través del sucesor viviente... o de Su forma radiante.

### El Maestro actual

El Maestro de la era presente... es un Maestro viviente. Está impartiendo instrucciones espirituales a Sus seguidores.

Pero todos los Maestros de tiempos pasados... son Maestros del Pasado. O Maestros de otros tiempos.

Cada uno de Ellos tuvo que desempeñar su propio papel.



Los relatos de los Maestros de la antigüedad... y fuera de época... así como Sus enseñanzas... hacen las veces de azada... que remueve el terreno aún no andado. Crean en nosotros interés... en los asuntos esotéricos del espíritu.

Cada uno de Ellos hace énfasis en la necesidad del Maestro viviente. Y deja registros de Sus propias experiencias espirituales.

Sus exhortaciones son las que nos mueven... para empezar a buscar. Nuestra ansiedad innata se activa. Y somos impelidos a ir en búsqueda de alguien... que pueda conducirnos a Dios.



Sin embargo... el verdadero trabajo de impartir instrucciones y guía espiritual... lo hace únicamente un Maestro viviente.

Altamente cargado como está de la Conciencia Suprema... inyecta en las almas... las *jivas*... Su propio impulso de Vida.

La espiritualidad no se puede comprar... ni enseñar. Se puede captar... como una infección... de alguien que ya esté sumamente infectado.

Así como la luz viene de la Luz... también viene la vida de la Vida. Y a un espíritu que está siendo dirigido por el cuerpo... solo lo puede mover un Espíritu que está liberado.



También se dice que *Bani*... el Verbo o Principio del Sonido... es el Guru. Y el Guru es el *Bani* personificado. Y el elixir de Vida... emana del *Bani*.

Quienquiera acepte lo que dice el *Gurbani*... puede ser liberado... mediante la gracia del Maestro viviente.



Bhai Gurdas dice en este contexto:

*Los Vedas y las escrituras... son las mercancías de los Maestros.*
*Y ayudan a cruzar el océano de la vida.*
*Pero sin un Maestro de la Verdad... que baje y viva entre nosotros... no podemos comprender la Realidad.*



Los misterios esotéricos no pueden explicarse totalmente por escrito. Ya que el proceso interno... tiene sus propias dificultades e impedimentos.

El Maestro... en Su forma sutil... ayuda de diversas maneras al espíritu en la jornada. De plano en plano.

Este trabajo de guía... tanto interno como externo... no pueden desempeñarlo Maestros del pasado.



El Verbo... *Shabd*... sin nombre y sin forma... toma una forma. Asume un nombre. Y habita entre nosotros.

En el Santo Evangelio tenemos:

*El Verbo se hizo carne... y habitó entre nosotros.*



A menos que Dios baje con apariencia de hombre... no Lo podemos conocer... al Incognoscible.

Las enseñanzas de las escrituras siguen estando selladas para nosotros... bajo el gran peso de palabrería antigua y arcaica. A menos que un Alma Maestra... que tenga verdadera experiencia de la ciencia del espíritu... nos explique la verdad de esas enseñanzas.



Ni aun las enseñanzas aparentemente sencillas de los Maestros del pasado... nos dan el significado correcto. A no ser que algún adepto viviente en esta línea... nos explique el verdadero significado... y nos haga tener las mismas experiencias... que se mencionan en las escrituras.



Al transmitir Su propio impulso de Vida... Él vivifica al espíritu... que está impotentemente contraído en el cuerpo... bajo el peso mortal de la mente y la materia.

Como un guía astuto... Él... de la manera inimitable que le es propia... con toda serenidad... lo pone en una nueva dirección.

Después... expone a la vista del espíritu... nuevos cielos llenos de maravillosas escenas. Le consigue un avión... *Shabd*... y Él mismo lo pilotea rumbo a Dios.

De día en día... el espíritu es conducido por agudos recodos. Toca lugares nuevos. Experimenta emociones desconocidas. Y disfruta de estimulantes experiencias... que son demasiado sutiles para ser descritas.



Todo esto... y mucho más... es el trabajo que tiene que hacer un Maestro viviente.



En la historia del sikhismo encontramos... que al Sagrado Granth lo compiló por primera vez el quinto Guru... Guru Arjan.

A pesar del bien conocido... y repetidamente citado aforismo de: *Bani es el Guru*... implicando con ello que no había necesidad de Gurus en lo sucesivo... los Gurus continuaron con la tarea de iniciar a la gente.

Y aun hoy... el Puro... *Khalsa*... de Luz interna perfecta y resplandeciente... está autorizado a llevar a cabo el trabajo de proporcionar guía e instrucciones espirituales... a los buscadores de la Verdad.



Guru Gobind Singh dice:

*Somos los adoradores de la Gran Luz Consciente.*

Y define la palabra *Khalsa* así:

*El Khalsa puro... es aquel en quien la Luz de Dios está totalmente manifestada.*

Y continúa diciendo:

*Khalsa es mi verdadera forma... yo resido en Khalsa.*
*Él es la vida de mi vida... y mi verdadero prano... aires vitales.*
*Khalsa es mi amigo valeroso... Khalsa es mi Satguru Puro... Maestro totalmente capacitado.*
*No he faltado a la verdad. Yo digo esto en la presencia de Par Brahm... y de Guru Nanak.*



Debemos aclarar que existe una gran diferencia entre *Gurbani* y *Bani*.

Lo primero se refiere a los dichos de los Gurus... según los registros de las escrituras sagradas... especialmente el Granth Sahib.

Lo último hace referencia a la Corriente del Sonido eterno... a veces llamado *Gurki-Bani*... que reverbera en toda la creación.

Emana de Dios mismo... y solo Él puede manifestarla.

Además... este *Bani*... *Naam* o Verbo... está sonando durante los cuatro *Yugas*... las eras. Y transmite su mensaje de la Verdad.

#### Elementos claves que resalten de cada capitulo para hacer énfasis en el aprendizaje

- El Maestro actual es un Maestro viviente... que imparte instrucciones en el presente.
- Los Maestros del pasado preparan el terreno... pero el trabajo directo de guía espiritual... lo realiza el Maestro viviente.
- La espiritualidad no se puede comprar ni enseñar. Se capta... por infección... del Maestro que ya está plenamente cargado de Vida.
- El Maestro viviente inyecta Su impulso de Vida... vivifica al alma... y la pilotea rumbo a Dios.
- Las escrituras y los aforismos no sustituyen al Maestro encarnado. El *Bani* es el Guru... solo cuando es manifestado por un adepto.

### La necesidad de un Maestro

El Dios sin forma... compenetra todo el universo... en la forma de *Shabd* o Verbo.

Pero nosotros no podemos sentirnos bendecidos... a menos que seamos capaces de entrar en contacto internamente con Él.



Toda la atmósfera está cargada de electricidad. Pero uno no puede obtener algún beneficio de ella... mientras no pueda llegar hasta un interruptor... que controla la energía... que viene de la planta eléctrica.

Una vez establecido este contacto... nos da luz... calor... o brisa fresca... según nuestras necesidades. Y nos ayuda en innumerables formas. Limpiando la casa. Cocinando nuestros alimentos. Y en otras cosas.

Transporta enormes cargas industriales... a semejanza del proverbial demonio. Y hace trabajos... que miles de personas juntas... no pueden hacer.



Exactamente de la misma forma... si uno pudiera llegar a alcanzar un polo humano... en donde la energía de Dios... en forma de Verbo... *Shabd*... está manifestada... uno podría ser verdaderamente bendecido. Y recoger una cosecha espiritual... más allá de toda medida.

Los Santos... Profetas... videntes... y Almas Maestras... son esa clase de polos manifestados... que irradian la Luz... la Vida... y el Amor de Dios.



Al trabajar en el plano físico... Él tiene que tomar un vehículo físico. Y trabajar por medio de él. Sin el cual... no puede impartir instrucciones espirituales.

Pero en cuanto Él desconecta a un espíritu humano de las diversas cubiertas o envolturas... Él también asume una forma sutil... luminosa... y resplandeciente. Y trabaja a través de ella.

Este proceso continúa... hasta que el espíritu del ser humano... se vuelve idéntico al del Maestro.



Este es el gran propósito... para cuyo cumplimiento vienen los Maestros a esta región más baja. Una región que está tan llena de miseria... y sufrimientos.

Armado con la Gracia Salvadora de Dios... en la forma del Espíritu Santo... llamada indistintamente *Shabd*... Palabra... Verbo... *Naad*... *Bani*... o *Kalma*... el Maestro salva a las almas que ya están maduras para la redención. A las que lo escuchan. Y a las que se esfuerzan en lograr su salvación... siguiendo Sus instrucciones.



A no ser que Dios venga con la apariencia de hombre... y habite entre nosotros... no podemos conocer a Dios... a pesar de Su presencia inmanente en todas partes.

Alguien tiene que batir la leche... para sacar la mantequilla. Y frotar los trozos de granito... para producir fuego. Antes que podamos saber... que la mantequilla está oculta en la leche... y el fuego... en la piedra.

Por eso se hace el Verbo carne... y habita entre nosotros. Según lo aprendimos del Evangelio sagrado.



Cuando los espíritus se inquietan de su largo exilio en el plano físico... y claman... desamparados... por regresar al hogar... sin poder ver la manera de salir de las garras del Poder Negativo... *Kal*... que todo lo abarca en forma de limitaciones de tiempo... espacio... y causación... entonces la Gracia Salvadora de Dios se conmueve con los lastimeros llamados. Y viene al mundo en la forma de un *Sant-Satguru*... Maestro de la Verdad... para ayudarlos a salir del atolladero.

El Maestro viviente es quien puede hacer este trabajo. Ningún otro puede hacerlo.

Él habla por medio de la Voz del Silencio. La Suya... es una ley no escrita. Y un lenguaje sin palabras.



Cuando termina Su trabajo... se retira de este mundo... del plano físico... y regresa al Océano de Espiritualidad de donde surgió. Dejando a Su sucesor... el trabajo de orientación posterior.



Asimismo... de acuerdo con la Ley de la Naturaleza... aun cuando el predecesor haya tenido que hacer algo por Sus seguidores... lo hace por medio del sucesor viviente... a quien Él confió el trabajo al retirarse. Y únicamente este último... como un hermano en fe... o *Gur-Bhai*... puede ayudar a guiar a sus hermanos... en el plano físico.



Es únicamente cuando somos capaces de dejar el plano físico a voluntad... o al momento de la muerte... que podemos entrar en contacto con el Maestro que nos inició... si es que ha dejado el cuerpo.

Aun durante Su vida en esta tierra... Su forma resplandeciente y luminosa... nunca baja del cielo astral... *Gaggan*. Pues Él siempre espera a los espíritus humanos... en el umbral de las regiones materio-espirituales.



Además... en la esperanza y creencia de que los Santos y los sabios del pasado pueden aún ayudarnos ahora... empezamos a conceder gran importancia a las corrientes altas y ocultas... malhechas y deformadas... de pensamientos y sentimientos. Y tratamos de actuar sobre las sugerencias de nuestra propia mente subconsciente. Comprendiendo muy poco su verdadero valor. Y teniendo por seguro... que las impresiones son de tal o cual Maestro del pasado.

Estas manifestaciones pueden aún haber sido suscitadas por algún agente distinto... a nuestro objeto de adoración... *Isht Deva*... o Maestro del pasado de nuestra elección.

Esto no se puede ver en su propia perspectiva... a menos que haya sido uno antes dotado con visión interna... *Divya Drishti*. La que puede penetrar con todo éxito el velo de la mente y la materia. Y ver claramente... y juzgar correctamente... la naturaleza de los impulsos internos mal concebidos. Al ir aflorando estos... confusamente... a la superficie mental.



Juntamente con lo anterior... no tenemos posibilidad de comprender el trabajo de un profeta... a quien nunca hemos conocido directamente.



Esto se le otorga al momento de la Iniciación. Al familiarizarlo con los diversos puertos de escala que hay en el camino interno. Con los diferentes signos y señales que sirven para distinguir y reconocer cada lugar. Las dificultades del viaje... y demás.

En esta forma... Él otorga al viajero el pasaporte necesario... y un permiso de desembarque.



Una vez que la semilla del Verbo... *Naam*... sea sembrada en un alma incorporada... o *jiva*... tiene que fructificar. Y algún día... tiene que llegar al Reino de Dios. Al Jardín del Edén. De donde fue desterrada desde tiempo inmemorial.

Y ninguna potencia... aquí o más allá... puede interponerse en el camino de regreso a su hogar.



La siguiente cosa que el Maestro hace... es fijar el sendero correcto que conduce hacia Dios.

Como un veterano del mar... Él fija toda la ruta para el viajero. Pues sin ella... éste no puede llegar a su destino. A pesar de toda su sincera devoción... y constante esfuerzo.

La guía correcta... es la segunda etapa preparatoria hacia Dios. Para esta empresa por mares desconocidos.

El Maestro mismo contrata el barco... y garantiza la seguridad del discípulo sobre la ruta. Advirtiéndole de los bancos de arena... y las rocas sumergidas que hay en el camino. Y de otros peligros que amenazan el viaje. Y de qué manera evitarlos mejor.



Él no se detiene aquí.

Maestro o Señor de ambos... Cielo y Tierra... cada día atraviesa a voluntad las diversas regiones espirituales.

*Such Khand*... o *Mukam-i-Haq*... es Su morada perpetua. Desde la cual... Él baja cada día al plano terrenal... para cumplir con los más bajos deberes que se le asignaron.



*Modelo de sabios... que se encumbran... pero sin vagar nunca.*
*Fieles a los puntos afines... de Cielo... y Hogar.*



Puesto que tiene un conocimiento personal... y experiencia real del viaje... que tantas veces hace diariamente... siendo un residente del plano más elevado... emite un alegre llamado... para los que están cansados del mundo.



Los espíritus requieren de ayuda de un instructor. Es aún mayor la necesidad de un instructor... para la Ciencia Espiritual... *Para Vidya*. Que es un proceso interno... mucho más allá del alcance de los sentidos. Teniendo que estudiarse en las profundidades de la mente... y experimentarse en el laboratorio del alma.

Ha estado encerrada durante eras y eras. Y está envuelta en profunda oscuridad. Y no hay acceso visible a ella.

El hecho es... que una persona se niega y se mofa de la necesidad de un Maestro de la Verdad. Y aun así... quiere aprender la Verdad por sí mismo. Pero en realidad... no la desea.

Su caso es igual al del hombre que prefiere cavar un pozo por sí mismo... en vez de saciar su sed en las refrescantes aguas de un cercano manantial... con un aguador listo para servirle.



Bhai Nandlal dice a este respecto:

*Nadie... sino un amante de rubíes... puede comprender el valor de un rubí.*
*Solo los ojos de un joyero... pueden con una mirada darle valor.*



La necesidad de un Maestro o Guru... es absoluta. Y no puede haber excepción a la regla.

Supongan, por ejemplo... que una persona desea dar un paseo aéreo por diversión. Nadie le permitiría subir a un avión. Y si sube sin ser visto... encontrará el aparato bajo llave.

Si de un modo u otro vence este obstáculo... no sabrá cómo manejar sus diferentes partes. Si trata de manejarlo... y el avión arranca... no puede hacer que se eleve... por falta de entrenamiento necesario.

Tampoco puede hacer que descienda. Ni lo puede manejar correctamente.

El resultado... tarde o temprano... será que se estrelle... con la pérdida de su vida.

El mecanismo del cuerpo humano es mucho más complicado... y delicado... que el de cualquier máquina. Por lo tanto... la necesidad de un adepto espiritual es mucho mayor. Tanto para el éxito en el proceso práctico del autoanálisis... como para el acceso a Dios Mismo... y al conocimiento de cómo actúa la Voluntad Divina.



El espíritu aprisionado en el cuerpo... no puede por sí mismo separarse de él.

Con su asiento arriba del foco de los ojos... el centro focal... compenetra el sistema total del cuerpo. Y los dos están indisolublemente entretejidos.

Si de una u otra forma... se encontrara momentáneamente liberado... y recogido en su centro... no puede penetrar en la aeronave del Verbo... *Shabd*.

Si pudiese encontrar una entrada... no sabe a dónde ir. Cómo ir. Y cómo regresar.

Pero si el maestro piloto... el *Sant Satguru*... pudiera estar ahí para llevar al espíritu consigo... y los dos pudieran entrar en el avión... y hacer juntos unos cuantos viajes felices por el reino espiritual... el espíritu podría también aprender cómo manejar la aeronave celestial. Y repetir los experimentos espirituales.



Alguien bien versado con el mecanismo del cuerpo humano... el cual está compuesto de tres cubiertas: física... astral... y causal... además de la entidad consciente... un viajero habitual de las regiones celestiales... día con día... puede iniciar a un espíritu en los misterios del conocimiento espiritual. Y mediante una demostración práctica... mostrarle una salida.

Con guía y ayuda verdaderas... el Maestro mismo dirige al espíritu... ileso de plano en plano. Y le va explicando por el camino... las señales y los puntos peligrosos. Las abruptas vueltas y revueltas. Los peligros de los reinos espirituales desconocidos... y no frecuentados.

Bendito es en verdad... el espíritu que se encuentra con semejante adepto... en la ciencia... y el arte... de la Espiritualidad.



Solo mala suerte seguiría los pasos de un espíritu... si llegara a despreciar la oferta del Maestro... y tratara de emprender el viaje divino por sí mismo. Sin la atención... y la ayuda de un Alma Maestra.

Maulana Rumi... por lo tanto... en términos inequívocos... previene en contra de tal curso:

*Encuentra a un Espíritu Maestro.*
*Pues sin Su ayuda y guía activas... este viaje está lleno de indecibles temores... riesgos... y peligros.*



En esencia... el Verbo... *Naam*... o *Dhun Atmic*... *Shabd*... es una ley no escrita. Dada en un lenguaje no hablado. Y por tanto... que no puede recibirse de escrituras... y de otros libros sagrados.

Esta riqueza puede solamente obtenerse de algún adepto del Verbo... *Naam*. Pues Él es Verbo personificado.

Solo Él... y nadie más... está capacitado para manifestárselo al espíritu.

Es una ley fundamental de Dios... que nadie puede manifestar al Verbo... *Naam*... excepto el *Satguru*... el Maestro de la Verdad.

El *Shabd* de un Alma Maestra... solo puede escucharse mediante Su gracia. Y nadie más puede siquiera hacerlo manifiesto.



Un Maestro de la Verdad... está totalmente versado en todos los misterios de la espiritualidad. De aquí que Su testimonio tenga peso... y Sus palabras cargadas lleven a la Verdad... y prueben ser efectivas.



*Escuchen el verdadero e infalible testimonio de los Santos.*
*Pues Ellos tienen una experiencia directa... de lo que dicen.*



El *Gurbani* también proclama enfáticamente... en términos inequívocos... la necesidad imperativa de un Alma Maestra.

Los espíritus en cuerpo físico... era tras era... han estado llevando la vida de los sentidos. Y nunca han sabido que hay también otra cara... en el cuadro de la vida.

La Verdad no se puede conocer o experimentar... sino mediante la gracia de un Maestro de la Verdad.



Sin un Maestro... nadie nunca encontró la Verdad. Ni en el pasado... ni en el presente.

La joya suprema del *Naam*... se ha mantenido en las manos de un Maestro. Y Él está capacitado para manifestarla a los *jivas*.

Por la gracia de Dios... llega uno a encontrar a un Maestro de la Verdad.

Después de haber pasado un espíritu por ciclos de nacimientos... le hace el Maestro escuchar la Corriente del Sonido.

Escuchen todos con atención... y sepan que no existe filántropo más grandioso que un *Satguru*. Pues Él confiere a los *jivas*... el precioso don del *Naam*.

Quienes estén preparados para perder su vida... es decir... para elevarse por encima de la vida física de los sentidos... encontrarán la Verdad... al entrar en contacto con un Alma Maestra.



Todos los Santos declaran al unísono... que sin un Hombre-Dios... no se puede alcanzar a Dios... y lograr la divinidad.

Dios mismo puso esto en claro con toda amplitud:

*Es un principio cardinal de Dios... que uno no puede siquiera pensar en Él... sin la gracia de un Satguru.*
*Nanak ha aprendido de Dios... que uno no puede salvarse... sin la ayuda activa de un Maestro.*



El *Satguru* es un gran oftalmólogo. Y un experto cirujano de ojos.

Todos estamos totalmente ciegos. Dios está dentro de nosotros... y a oscuras lo buscamos a tientas externamente.

Pero al entrar en contacto con un Maestro perfecto... *Satguru*... nos restaura la visión perdida. Y empezamos a realizar... y a experimentar a Dios... en el laboratorio de la mente humana.



La humanidad entera está ciega. Y ciegamente ocupada en actividades de la oscuridad. No encontramos el camino de salida.

¡Oh Nanak! Cuando un espíritu encuentra a un Maestro de la Verdad... empieza a ver con sus propios ojos... naturalmente... el ojo interno... y realiza la verdad... en la profundidad del alma.



Somos nada menos que realmente ciegos. Ya que no vemos... aunque tengamos ojos físicos.

La ceguera no consiste en la pérdida de los ojos... sino en mantenerse lejos de Dios.



Nanak nos dice:

*No llamen ciegos a quienes no tengan ojos... ¡oh Nanak!*
*En verdad son ciegos... aquellos que no ven la Luz de Dios.*



Guru Arjan nos dice... que aun una persona con ojos puede estar ciega... si no ve a Dios. Quien es la mismísima alma de su alma. Y por ello... comete pecados.



*Una persona en completa posesión de sus sentidos... puede sin embargo estar ciega.*
*Si considera que Dios... la mismísima alma de su alma... está muy alejada de Él.*
*Y por tanto... está desvergonzadamente ocupado en lo maligno.*



Con los ojos físicos... vemos el mundo físico que nos rodea.

Pero el Tercer Ojo... o *Shiv Netra*... en cada uno de nosotros... está cerrado.

Cuando este ojo se abre... podemos ver las maravillas de los mundos astral y causal. Y aun las del mundo puramente espiritual... más allá de éstos.



*Ciego es quien ejecuta actos de ceguera... porque su ojo interno está cerrado.*



Todos nosotros estamos ocupados con la materia... y no sabemos si existe algo más.



*Siempre ocupado con la mente y la materia... ni siquiera piensa en Dios.*
*En cautiverio por Hades... en los infiernos... está siempre en perpetua miseria.*
*Ciego y sordo... no ve más allá.*
*Esclavo de la mente... está sumergido en pecados.*



Es imposible para cualquiera... entrar a regiones más elevadas... por sus propios esfuerzos.

Es imperativo que un aspirante a ello... lleve consigo a un adepto... que ande diariamente el sol y la luna... en sus viajes celestiales.

#### Elementos claves que resalten de cada capitulo para hacer énfasis en el aprendizaje

- Dios compenetra todo como *Shabd*... pero solo un Maestro viviente puede conectarnos con esa Corriente.
- El Maestro es el polo humano donde la energía divina se manifiesta. Sin él... no podemos beneficiarnos de la electricidad espiritual.
- Ninguna práctica externa... caridad... o erudición... sustituye la necesidad del *Satguru*.
- El Maestro es barco y capitán a la vez. Sin Él... nadie cruza el océano de la vida.
- Las escrituras de todas las religiones —Upanishads... Biblia... Corán... Gurbani— confirman esta necesidad absoluta.

### Santos del pasado

Cuando termina Su trabajo... se retira de este mundo... del plano físico... y regresa al Océano de Espiritualidad de donde surgió. Dejando a Su sucesor... el trabajo de orientación posterior.



Asimismo... de acuerdo con la Ley de la Naturaleza... aun cuando el predecesor haya tenido que hacer algo por Sus seguidores... lo hace por medio del sucesor viviente... a quien Él confió el trabajo al retirarse. Y únicamente este último... como un hermano en fe... o *Gur-Bhai*... puede ayudar a guiar a sus hermanos... en el plano físico.



Es únicamente cuando somos capaces de dejar el plano físico a voluntad... o al momento de la muerte... que podemos entrar en contacto con el Maestro que nos inició... si es que ha dejado el cuerpo.

Aun durante Su vida en esta tierra... Su forma resplandeciente y luminosa... nunca baja del cielo astral... *Gaggan*. Pues Él siempre espera a los espíritus humanos... en el umbral de las regiones materio-espirituales.



Además... en la esperanza y creencia de que los Santos y los sabios del pasado pueden aún ayudarnos ahora... empezamos a conceder gran importancia a las corrientes altas y ocultas... malhechas y deformadas... de pensamientos y sentimientos. Y tratamos de actuar sobre las sugerencias de nuestra propia mente subconsciente. Comprendiendo muy poco su verdadero valor. Y teniendo por seguro... que las impresiones son de tal o cual Maestro del pasado.

Estas manifestaciones pueden aún haber sido suscitadas por algún agente distinto... a nuestro objeto de adoración... *Isht Deva*... o Maestro del pasado de nuestra elección.

Esto no se puede ver en su propia perspectiva... a menos que haya sido uno antes dotado con visión interna... *Divya Drishti*. La que puede penetrar con todo éxito el velo de la mente y la materia. Y ver claramente... y juzgar correctamente... la naturaleza de los impulsos internos mal concebidos. Al ir aflorando estos... confusamente... a la superficie mental.



Juntamente con lo anterior... no tenemos posibilidad de comprender el trabajo de un profeta... a quien nunca hemos conocido directamente.

#### Elementos claves que resalten de cada capitulo para hacer énfasis en el aprendizaje

- Los Santos del pasado cumplieron su papel... y dejaron registros valiosos... para inspirar la búsqueda espiritual.
- Sin embargo... el trabajo de iniciación y guía interior... corresponde al Maestro viviente de la era actual.
- Los Santos del pasado pueden ayudar indirectamente... pero no sustituyen al Maestro encarnado.
- La verdadera ayuda de un Maestro del pasado... llega a través del sucesor viviente.
- Las manifestaciones psíquicas atribuidas a Maestros fallecidos... pueden ser engañosas. Solo la visión interna discernida... las valida.

### Sin un Maestro todo es oscuridad

Sin un Maestro... Guru... estamos en completa oscuridad.

La realidad sigue siendo simplemente algo oculto. Y un espejismo.

Es una ley que no está escrita. Y un lenguaje no hablado. Casi ininteligible. Excepto cuando un Alma Maestra... con Su atención personal... le da significado.



El encanto del mundo es tan grande... y tan subyugador... que los espectros pasajeros parecen estables y substanciales. Lo falso se cubre con el manto de la Verdad. Y no tenemos posibilidad de rasgar el velo mágico... y escapar del falso hechizo que nos envuelve.



La Gracia del Maestro... es la que puede sacar al espíritu de la cubierta física... por encima del plano de los sentidos. Capacitándolo para moverse desencadenado... hacia visiones espirituales más elevadas. Y alcanzar así... su divinidad original.



Sin un Maestro... la oscuridad es absoluta. Y uno se hunde en profundidades sin fin.

Un espíritu en cuerpo... no puede obtener bienaventuranza... a menos que adquiera experiencia de sí mismo... a través de la gracia de un Maestro viviente.

Él inicia al alma en el conocimiento esotérico. El cual tiene que practicarse... en el laboratorio de la mente humana.



*Sin un Maestro... existe una oscuridad cegadora.*
*Y uno sencillamente... no puede discernir.*
*Sin un Maestro... el espíritu no se vuelve Espíritu.*
*Y no puede haber salvación para él.*
*En verdad... en verdad les digo... que deben tener un Maestro.*



*¡Oh mente! Debes acudir a un Alma Maestra.*
*Acepta como Maestro... a un adepto del Principio del Sonido.*
*Y Él te lavará... hasta limpiarte de todas las impurezas.*



*El Maestro... mediante Su atención y Su instrucción... imparte el Conocimiento de la Verdad.*
*Aquel que nunca ha visto a un Alma Maestra... ni ha aceptado a una... sencillamente desperdicia su vida en este mundo.*



Un Alma en cuerpo... *jiva*... está siempre en absoluta oscuridad.

Si cierra los ojos... adentro hay oscuridad. Además... está envuelta en total ignorancia.

A quien puede disipar esta oscuridad de las almas... *jivas*... se le llama un Guru. Maestro.



El término *Guru* consta de dos palabras. *Gu*... que significa oscuridad. Y *ru*... que significa Luz.

Por tanto... *Guru* es aquel que nos puede conducir... de la oscuridad a la Luz. De la falsedad a la verdad. Y de la muerte... a la inmortalidad.



El ilustre poeta Kalidas... habla así del Guru:

*Él convierte la oscuridad en Luz.*
*Y hace visible... al Dios invisible.*



Como un alma en cuerpo... *jiva*... está envuelto en ignorancia. Y de esta forma... lo mantienen en cautiverio.

Los Santos declaran... que sin un Alma Maestra que nos guíe... todas las obras de caridad y actos meritorios... como el estudio de escrituras... los ayunos... las vigilias... hacer peregrinaciones... la observancia de costumbres sociales y rituales... y la adherencia escrupulosa a estrictos preceptos religiosos de antaño... no ayudan a la liberación de un alma.



Kabir Sahib... por tanto... en términos muy definidos... nos previene contra actos de esta clase:

*De barro... sencillamente... no puede hacer nada sin un Alma Maestra.*
*Sin un benéfico Guru... nadie encuentra una salida.*
*Aunque ejecute millares de obras de caridad... y acciones meritorias.*



Nuevamente dice Tulsi Sahib:

*Tulsi... sin la ayuda de algún Murshid-i-Kamil... Maestro perfecto... no puedes obtener salvación.*
*Ni tampoco puedes ver el camino... que a ella conduce.*



En el *Gurbani* encontramos... que en forma enfática... se hace referencia a la necesidad de un Maestro:

*Que no quede la mínima duda en la mente de alguien.*
*Pues nadie ha cruzado los mares tempestuosos y agitados de la vida... sin un Guru.*
*El mundo es un terrible océano.*
*El Verbo del Maestro es el barco... y Él es su capitán.*
*Es con Su gracia... como uno puede llegar a Dios.*
*Y no hay otro camino.*



*El Guru es al mismo tiempo... el barco... y el capitán.*
*Y sin Él... nadie puede cruzar.*
*Dios es el verdadero regalo del Guru.*
*Y el camino de la salvación... es por medio de Él.*



En las escrituras de los hindúes... también encontramos muchas referencias similares.

En el *Katha Upanishad*... tenemos:

*Muy pocas son en verdad... las personas que tienen la buena fortuna de oír hablar de Dios.*
*Y menos aún... quienes lo pueden conocer.*
*Bendita es el alma elevada que habla de Él.*
*Benditos son quienes tienen acceso a tal personaje.*
*Y verdaderamente bendito... es aquel que con Su ayuda y guía... encuentra a Dios dentro de sí mismo.*

### Evidencia histórica

Contamos con el testimonio de la historia... para demostrar... que no puede uno por sí mismo... tener acceso a regiones espirituales.

En los *Shastras* se menciona... que a Narad se le negó el acceso a *Vishnupuri*... la región de Vishnu... cuando por sí mismo intentó entrar en ese reino. Porque no había sido iniciado... por algún Maestro. Un Guru.



También a Sukh Dev Swami... el hijo de Ved Vyas... con todo su conocimiento espiritual y erudición... adquiridos desde la concepción en el vientre de su madre... no pudo entrar en el reino de Vishnu... hasta que aceptó a Raj Rishi Janak... como su mentor espiritual.



En ninguna parte encontramos ejemplo alguno... de que a un *jiva*... un alma en cuerpo... no iniciado... se le haya permitido disfrutar de este privilegio.

Todos los que nacen Santos... aunque son muy pocos... vienen desde su nacimiento al mundo... con conocimiento esotérico. Pero tienen por formalidad... que adoptar a un Maestro.



Kabir Sahib... por ejemplo... tuvo que aceptar a Sri Ramananda como Su Maestro.

A pesar de sus antecedentes espirituales perfectos... tuvo que asociarse con Santos... como uno lo haría... en un curso de repaso.



Guru Amar Das nos dice... que es Ley de Dios... que uno no pueda siquiera pensar en Él... sin que algún Maestro de la Verdad... nos lo haga recordar.



*Es orden de Dios Mismo... que uno piense en Él... solamente cuando encuentre a un Maestro de la Verdad. Un Hombre-Dios.*



También:

*Ninguno puede venir a mí... si el Padre que me envió no le atrajera.*
*Y yo lo elevaré... en el último día.*

Juan, capítulo seis, versículo cuarenta y cuatro.



La generalidad de la humanidad... sencillamente no puede pasarse... sin un Alma Maestra.

Hasta el Señor Rama... y el Señor Krishna... las mismas encarnaciones de Vishnu... tuvieron que inclinarse ante Maharishi Vashisht... e Ingris Rishi... respectivamente.

Si estos personajes de alma elevada... cuyos dominios abarcan hasta la región Causal... tuvieron que aceptar un Guía Espiritual... nosotros... los seres humanos comunes... no podemos ser dispensados... de esta necesidad absolutamente básica.



Guru Nanak enfáticamente declara... que la importancia de un Guru... puede conocerse por Brahma... Narad... y Ved Vyas:

*¡Oh hermano! Sin un Guru... no puedes recibir la Verdad absoluta.*
*Como opuesta al conocimiento relativo... por medio de la percepción de los sentidos.*
*Pueden verificar esto... con las referencias de Brahma... Narad... y Vishnu.*



Tulsi Sahib dice:

*¿Quién es más grande que Rama y Krishna?*
*Ellos también tuvieron que aceptar un Maestro.*

### Antes y después de Guru Nanak

Siempre hay alimento para el hambriento. Y agua para el sediento.

A un bebé que nació hace quinientos años... le proveyó la Naturaleza de leche del pecho de la madre. Y lo mismo sucedió... con quien vino al mundo hace mil años.

A los que nacen en la era actual... también se les provee de medios similares de sustento.

La ley de demanda y suministro... es ley inmutable en la naturaleza.



Exactamente de la misma manera... trabaja también esta ley... en forma inexorable... en asuntos espirituales.

Para los aspirantes de la época anterior a Guru Nanak... en esta era... o después... no puede la naturaleza sino proveer los medios... para satisfacer sus aspiraciones.

El fijar límites a un periodo en particular... de uno o dos siglos... y señalarlo como el periodo de los Gurus... y decir que no había Almas Maestras antes o después de esa época en particular... está en contra de la ley fundamental de demanda y suministro. Y por ello... es incorrecto.



Las enseñanzas de los Maestros... son para todos los tiempos. Y no para algún periodo en particular.

Ellos expresan verdades eternas... que subsisten toda la eternidad. Y son la herencia común... de la humanidad en general.

- Las enseñanzas de los Maestros son eternas... y no pertenecen a una época exclusiva.
- Los Santos aparecen continuamente... para reorientar la antigua ciencia... según las necesidades de la era.

### Las escrituras y su valor

El Guru es un ser altamente espiritual... con dominios que se extienden hasta *Sach Khand*.

Tiene un conocimiento directo de *And*... *Brahmand*... y *Sach Khand*. Las tres grandes divisiones. De la física... hasta los reinos puramente espirituales.



Libre de las garras del cuerpo y de la mente... está cargado de espiritualidad pura.

A menos que un alma en cuerpo... *jiva*... entre en contacto con un ser así... sus aspiraciones espirituales latentes... no se avivan.

El Maestro... Guru... es realmente una vela encendida... que enciende muchas velas apagadas. Él puede... al transmitir Su propio impulso de vida... vivificar a otros.



Algunas personas sienten... que con solo estudiar las escrituras... pueden tener luz espiritual. Y que no necesitan Maestro para este propósito.

Podemos detenernos aquí... y considerar el valor y la importancia... de los libros sagrados... o escrituras sagradas.

Estos no son... después de todo... sino los registros de los experimentos... y las experiencias espirituales personales... de los antiguos sabios... videntes... profetas... y hombres piadosos.

Es bueno leerlos con amorosa devoción. Debemos tenerles respeto. Pues constituyen un gran tesoro de espiritualidad... que nuestros antepasados dejaron... para nuestro beneficio.



*¡Oh Nanak! Uno puede estudiar doctrina sagrada por peso... y estar ocupado incesantemente en esa tarea.*
*¿Qué valor tiene... después de todo... la erudición... cuando el Naam está mucho más allá de todos los libros sagrados?*
*Después de todo... los libros contienen una descripción del conocimiento de Dios. Pero no pueden en realidad... entregar la mercancía.*



*Ten por seguro... que la esencia de todo conocimiento... y de toda sabiduría... está en Dhuni. El Principio del Sonido. Y como tal... es indescriptible.*



Esta ciencia está dentro de nosotros. Pero no la podemos obtener... a menos que sepamos ir a lo interno.

Como Emerson lo expresa. El doctor J. D. Rhine... parapsicólogo e investigador... nos dice en su libro *La Mente y el Nuevo Mundo*... que hay algo en el ser humano... que trasciende toda materia.

Si el conocimiento espiritual se pudiese obtener de los libros... entonces todos los eruditos serían ahora santos.

Pero en la experiencia real vemos... que a pesar de todo su aprendizaje literario... continúan siendo tan materiales... como las mismas librerías... que albergan estos libros.

Cargados con el peso muerto del conocimiento literario... se les puede comparar con un asno... que se bambolea bajo la carga inanimada de madera de sándalo. Y que no siente la dulce fragancia... que emana de ella.



Como un cucharón metido en el budín... ignoran el sabor del budín.

En esta era de erudición... en que el mundo está literalmente invadido de libros... desafortunadamente no hay flujo alguno de espiritualidad. Y ni siquiera un mínimo... de gente de mentalidad espiritual.



No hay nada en común... entre un sabio mundano... y un devoto.

Quien nunca ha conocido la devoción... no puede conocer el valor de un Maestro. Quien es un Dios polarizado. Que benévolamente esparce Luz al mundo.



Hablando claramente... el término *Guru*... no es un apelativo que se da a cualquier persona.

Significa... y representa... un poder dinámico... que trabaja en... y a través de... una forma humana en particular. Y es el ideal para todos nosotros.

Este es el poder... que ayuda en el progreso espiritual.

Al igual que una lámpara proyectora de rayos de luz concentrados... el Maestro inunda al mundo con Su Luz espiritual. Y uno no puede ver nada... que no sea Luz.

Los aspirantes a la espiritualidad... se reúnen a Su alrededor... como mariposillas. Y ofrecen un holocausto de sí mismos... en Su augusta y sagrada presencia.



Kabir Sahib dice:

*Los ignorantes consideran al Maestro... como a un ser humano.*
*Y son atrapados en el remolino del mundo... y se hunden.*
*Su mente y cuerpo no tienen consecuencia... y no pueden ganar nada.*
*No pueden ellos desarrollar ninguna devoción en sí mismos.*
*Por tanto... no pueden escapar del cautiverio.*
*Y tales jivas van de cabeza... al fuego del infierno.*
*E incesantemente se mueven... en la gigante rueda de la creación.*

### El Maestro (Guru) es Superhombre u Hombre-Dios

El Maestro es en verdad... la perfecta manifestación de Dios.

Saturado de Luz divina... es portador de la antorcha de Dios.

Es el polo... desde el cual Dios lleva a cabo Su plan de redención.



Dios... habiendo hecho al ser humano a Su propia imagen... colocó una muralla de hierro... entre Sí Mismo... y el espíritu. Debido al primer pecado... de desobediencia hacia Él.

El hombre fue así expulsado del Jardín del Edén... y colocado en el mundo físico. Según la historia... para ganarse su sustento con el sudor de su frente. Y luchar por su salvación... por medio de un Salvador. El Hijo del hombre.

En cuya vestimenta... Dios Mismo viene con la llave... para abrir el Reino de los Cielos. Y dejar entrar... a las ovejas perdidas.



El Verbo se hace carne... y vive entre nosotros.

La Luz de Dios brilla en Sus ojos. La Voz de Dios habla por medio de Él. Y la gracia de Dios... concede la salvación... a quienes tienen hambre y sed de Él.



Al igual que un hombre común... Él vive entre nosotros. Comparte nuestras alegrías y tristezas. Nos da instrucciones sobre espiritualidad. Y nos guía en el Sendero.

Incrustado en el Padre... Él hace Su voluntad.



*Todo me ha sido dado por mi Padre.*
*Y ninguno ha conocido al Hijo... sino el Padre.*
*Ni nadie conoce al Padre... sino el Hijo.*
*Y aquel a quien el Hijo desee revelarlo.*

Mateo, capítulo once, versículo veintisiete.



Maulana Rumi también dice:

*En el Maestro están morando ambos... Dios... y el Mediador.*
*No hay en verdad... ni la más mínima distinción... entre los dos.*
*Desecha todo pensamiento de dualidad de tu mente.*
*Porque si no... te perderá en el desierto.*
*Y también será ese... el destino de tu primera lección de espiritualidad.*
*Quien considere a los dos... como entidades separadas... aún no ha aprendido nada. Ni conoce nada del Maestro.*



El Maestro es la forma del Dios sin forma. La forma que podemos ver... y con quien podemos relacionarnos.

Esta es la mismísima forma... que nos imparte el conocimiento de Dios. Y también es esta misma forma... luminosa naturalmente... la que nos acompaña en la jornada hacia Dios. Y dirige nuestros pasos... sobre el Sendero.



En cada plano... en el físico... en el causal... y más allá... hay un esplendor acrecentado del Maestro. Y Su influencia y poder ilimitados... se hacen más manifiestos al espíritu compañero... mientras viaja hacia adelante.



Siendo Hombre-Dios en el mundo... para los musulmanes representa la *Kibla* y la *Kaaba*. El altar de los cristianos. La eterna Luz de los zoroastrianos. El templo. La sinagoga. Y el *gurdwara*.

Pues únicamente Él... es digno de ser adorado.



Al igual que la electricidad en la atmósfera... está el universo cargado completamente de Dios. No hay lugar donde Él no esté.

Empero... Él está oculto para la vista. Y el Maestro... o Guru... es el poderoso interruptor. La fuente... y divinidad... que nos da acceso.



Maulana Rumi nos dice en este contexto:

*¡Oh amigo! Siéntate junto a alguien... que conozca la condición de tu corazón.*
*Y que pueda hacerlo entero.*
*Descansa un momento bajo la sombra de un árbol... que está cargado de frescas y fragantes flores.*
*No vagabundees por la plaza del mercado... de tienda en tienda... como lo hacen los holgazanes.*
*Ve directamente a aquel... que tenga una tienda con miel.*
*Cógete del vestido... ¡oh alma valiente!... de aquel que conozca bien los diversos planos: físico... astral... causal... y más allá de estos.*
*Y sea capaz de quedarse contigo... como un verdadero amigo.*
*Ya sea en la vida... o en la muerte.*
*En este mundo... o en el siguiente.*



La forma... física o astral... del Maestro u Hombre-Dios... que nos ayuda en toda nuestra jornada hacia Dios... es mucho mejor... que la invisible forma nativa de Dios. La cual está más allá de todo pensamiento... y de toda contemplación.



Brahma... Vishnu... Shiva... Ishwar... *niranjan*... y Parmeshwar... encarnaciones de Brahma... todos son dignos de nuestro respeto y adoración.

Hemos leído mucho sobre ellos... en forma religiosa... en tratados sagrados. Figuran como héroes y heroínas... en historias mitológicas. Pero como tales... no son sino ficciones de la imaginación humana.

Cuando el Maestro... o *Satguru* de la Verdad... toma a su cargo a un espíritu... en el *Gaggan*... Él gradualmente revela... el verdadero significado y forma de cada uno de ellos.



Todos ellos han existido desde el comienzo de la creación. Y están ocupados en llevar a cabo... las obligaciones que a cada uno les han sido asignadas.

Pero no podemos conocerlos... ni conocer su labor y su autoridad... a menos que el *Satguru* nos lleve... y nos muestre la naturaleza de esta misteriosa jerarquía.



Dios Mismo... en la vestimenta del hombre... Santos y Profetas... nos informa sobre Su propio ser natural.

Así... Guru Ram Das ha declarado:

*Es el principio básico de Dios... que sin un Maestro de la Verdad... nadie puede siquiera pensar en Él.*



Sant Kabir también nos dice:

*El Maestro es más grandioso que Dios.*
*Bien pueden ustedes pensar en esta sentencia.*
*La devoción a Dios... mantiene a una persona enredada en este lado. El plano físico.*
*Pero la devoción al Guru... la lleva a Dios.*

Y viene al mundo... en la forma de un *Sant-Satguru*... Maestro de la Verdad... para ayudarlos a salir del atolladero.

El Maestro viviente es quien puede hacer este trabajo. Ningún otro puede hacerlo.

### El Maestro y Su trabajo

El Maestro es como un árbol que concede deseos. Siempre cumple los deseos de los buscadores. Cualesquiera que estos sean.

Los ricos... y los pobres. Los elevados... y los inferiores. Todos van a Él... buscando algo.

Su mayor placer... sin embargo... consiste en liberar a los espíritus... de las garras del cuerpo... y de la mente.

Sin tomar en cuenta el aspecto sectario... Él atiende las necesidades espirituales de todos.



El Maestro ni crea nuevos ismos... ni censura los ismos que ya existen.

Él no viene a violar la Ley... sino a cumplirla.

Todos los ismos espirituales... de hecho... reciben de Él... fuerza y solidaridad.



En Su inimitable manera amorosa... lleva a cada uno... por la línea de menor resistencia.

No interfiere con los credos o creencias de una persona... cualesquiera que éstos sean. Ni tampoco se mezcla en el orden social de las cosas.

Él sencillamente habla del espíritu. De su naturaleza intrínseca. De su asiento en el cuerpo físico. Sus diversos procesos. Capacidades latentes. Y cómo puede desarrollarse... en su relación con el cuerpo... la mente... y con Dios.

Y de cómo puede ser liberado. Cómo establecerse en equilibrio en sí mismo. Y tornarse hacia Dios.



Su interés es directamente con el espíritu. Y Sus palabras penetran hondamente... en las mismísimas profundidades del alma.



Él trata directamente en efectivo... sobre el presente. Y no hace que la gente viva de esperanza... hasta el fin de sus vidas... o después de la muerte.

Él enseña:

*No crean en las palabras de un Alma Maestra... a menos que vean con sus propios ojos... las cosas sobre las que habla.*



Es solo por razón del experimento... por lo que tenemos al principio... que aceptar las palabras del Maestro.

Pero cuando encontramos la verdad de lo que dice... mediante una experiencia verdadera... entonces se convierte la hipótesis... en convicción.

Cuando una persona ve una vez la luz del sol... no puede negar la existencia del sol... aunque todos los murciélagos del mundo... se unan para negar el fenómeno solar.

A menos que se tenga acceso a la visión interna... la verdad de la Realidad no alborea. Y los espíritus en cuerpo... o *jivas*... siguen tanteando en absoluta oscuridad... y en ignorancia de lo más elevado... y de la mayor magnitud.



Siempre que un Maestro de la Verdad viene al mundo... se reúnen a Su alrededor... los espiritualmente hambrientos y sedientos. Y sacian su hambre y su sed... con el maná... y el elixir de Vida... que Él libremente da a los aspirantes.

El amor de los aspirantes... gradualmente se desarrolla... hasta volverse una firme devoción. Que los capacita más y más... para la gracia salvadora del Maestro. Y ayuda a las almas... *jivas*... a viajar rápidamente hasta su Hogar.

### El Maestro y Sus deberes

Incontables son las obligaciones y responsabilidades de un Maestro.

Su primera y principal labor... es la de enlazar de nuevo... al creado con el Creador. Ganando para Él... el Reino de Dios. Y restituirlo a su antiguo y olvidado linaje... y herencia.

Esto lo hace por medio del Verbo... o *Shabd*... que lleva al espíritu... a su Hogar nativo.



Al igual que ondas electromagnéticas... el Verbo o *Shabd*... está vibrando en todas partes. Pero desafortunadamente... a causa de la densidad... y peso abrumadores de la materia en el plano físico... somos incapaces de sentirlo... y utilizarlo para nuestro beneficio.

Un Maestro... con Su guía personal... libera al espíritu del peso muerto de la materia. Lo desliga de los órganos sensorios. Retira sus rayos... que continuamente se esparcen... y los recoge en su centro... detrás de las dos cejas.

Capacitándolo así... para experimentar un poquito de la Luz de Dios... y para escuchar el Verbo... *Shabd*... la Voz de Dios. Los cuales... mediante la práctica continuada... pueden ser desarrollados con el tiempo.



El alma en cuerpo... *jiva*... se encuentra entonces atraída... por el poder magnético... el Principio del Sonido. El cual la lleva paso a paso... hasta su meta final.

Un simple conocimiento... por qué luchar. De ahí en adelante... es todo el trabajo del Maestro.



Además de esto... un Maestro es un hijo de la Luz. Y al igual que un faro en los tempestuosos mares... esparce Su benevolente Luz... por todo el mundo.

Como el buen pastor... tiene que cuidar y vigilar a muchas ovejas.

Quienquiera que tenga algo que ver con el Alma Maestra... tiene finalmente que ser preparado para el Sendero... y ayudado en todo el tiempo de pruebas y aprendizaje.

Y a la cual... el espíritu realmente percibe... con su Luz interna.

Cuando el espíritu se encuentra cara a cara... con el Maestro astral... toda duda se desvanece. Y su trabajo recibe... la recompensa sublime de la vida.

Maulana Rumi nos dice:

*Si desearas ver esta Luz refulgente... vuelve a casa como Ibrahim.*
*Atraviesa la estrella grande... y el cielo... y la lejanía azul.*
*Con firmeza... pasa sobre el sol... y la luna.*
*Y después... te encontrarás en la presencia celestial.*



Guru Nanak se refiere a este Sendero iluminado así:

*La forma luminosa del Maestro... es maravillosamente arrebatadora... y encantadora.*
*Solo un Maestro perfecto... puede manifestar esto a un espíritu.*



Esta forma brillante del Maestro... siempre acompaña a un espíritu... en los diversos planos. Culminando en *Sach Khand*... o el hogar de la Verdad.

Cuando desciende Su forma luminosa... al foco de los ojos... un devoto no tiene ya por qué luchar.

Aquí se centra la devoción del devoto. La mitad de su éxito se ha logrado. Y desde aquí... toma la forma astral del Maestro... bajo Su cuidado... al espíritu. Con la total responsabilidad de conducirlo... a la meta final.

Hasta los Santos adoran también a esta forma. Y derivan de ella... un deleite extático.



*Los benditos pies del bienamado Gurudev... son adorados por los Santos.*
*Los bienamados de Dios.*



Khawaja Moeen-ud-Din Chisti también habla de la forma luminosa del Maestro:

*¡Oh Maestro! El sol no puede soportar el resplandor de tu faz.*
*La luna también se ha cubierto con nubes... para escapar de tu Luz deslumbradora.*
*Habiendo tomado el sol prestada su brillantez del polvo de tus pies... ha fijado su pabellón dorado... en el cielo azul.*
*Si un solo rayo de tu faz fuese lanzado al cielo...*



En el *Sar Bachan* de Swami Ji Maharaj... tenemos una referencia similar:

*Maravillosamente extraña era la Forma.*
*Ninguna palabra podría escribir esta gloria.*



Hafiz... un poeta místico de gran renombre... nos dice:

*Como la luna recién nacida... los puros de vista pueden ver.*
*Y Su gloria... no se manifestaría a todos los ojos.*



La forma astral de un Alma Maestra... es incambiable... y permanente.

Es la forma que guía a los aspirantes... a su meta.



*Gurudev está en el comienzo de la creación.*
*Él está en el comienzo de cada era... y continúa de era en era.*
*Únicamente por medio del Gurudev... puede uno llegar a Hari.*



Guru Arjan habla del *Guru Dev* así:

*Salutaciones al Eterno Guru... Hari Rai.*
*Salutaciones al Guru de la era... Sat Purush... o Ram Rai.*
*Salutaciones al Satguru... la manifestación de Sat Purush.*
*Salutaciones a Gurudev... la refulgente y autoluminosa forma del Guru.*
*El vínculo entre el Guru y el Satguru.*
*Responsable de guiar y conducir al espíritu... a través de los diversos planos.*



*Guru Dev*... es la manifestación más grandiosa... y más elevada... de *Sat Purush*.

Es el poder controlador de Dios. Y puede conceder salvación.

Por medio de la devoción a Él... recibe uno plena confortación.



*Nada sino Verdad eterna... Sat... es Gurudev.*
*Aparte de esta... falsa es toda otra adoración.*



Guru Arjan... en sus memorables palabras... canta la grandeza de *Guru Dev* en esta forma:

*Gurudev es padre. Gurudev es madre. Y Él es el Maestro... y Dios Mismo.*
*Gurudev es un verdadero amigo. El que hace desaparecer la oscura ignorancia... y rompe todas las ataduras.*
*Gurudev es el otorgador del Naam... un encantamiento que ahuyenta todo lo maligno.*
*Gurudev es la personificación de la paz... la verdad... y la inteligencia. Y realmente... una piedra filosofal.*
*Gurudev es un lugar de peregrinación... fuente de elixir de Vida... y Luz de la razón.*
*Gurudev todo lo ordena... destruye los pecados... y purifica a los pecadores.*
*Gurudev es eterno desde la creación... y el comienzo de cada era. Y Su palabra... tiene una gracia salvadora.*
*Gurudev es el don más grande de Dios. El cual... si es concedido... salva a los peores pecadores.*
*Gurudev es Satguru... Par Brahm... y Parmeshwar.*
*Salutaciones a Él... ¡oh Nanak!*



El *Gurbani* nos habla del inmenso beneficio... que uno disfruta... al encontrar al *Guru Dev*.

Los cinco pecados mortales: lujuria... ira... codicia... vanidad... y egoísmo... sencillamente se desvanecen.

Miriadas de impresiones kármicas... de incontables eras... quedan destruidas.

Él saca el alma... *jiva*... de la conciencia del cuerpo y de la mente. Y lo acomoda dentro de la conciencia cósmica. Donde ya no experimenta más... los fuegos del mundo... en el cual está la humanidad entera atrapada.

Aun en el mundo... quedan cumplidos todos los deseos del alma. De ahí en adelante... su curso es suave y alisado. Y recibe aclamaciones de todas partes.



En esta Era de Hierro... *Kali Yuga*... de iniquidad y oscuridad... el *Guru Dev* es como la luz de un faro... en el tormentoso mar de la vida. Y con seguridad... guía a los pecadores... al Cielo de paz y bienaventuranza.

Un alma salvada... a su vez... jala a todos los que están cerca de ella... y le son queridos.

La manifestación del *Guru Dev*... depende puramente de la gracia de Dios... y de los méritos especiales de uno... en su progreso en el Sendero Espiritual.

- Su visión desvanece toda duda... y recompensa el trabajo del amor.
- El *Gurudev* es padre... madre... amigo... y otorgador del *Naam*.
